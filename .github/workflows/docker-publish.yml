# 构建镜像并发布到 GHCR(GitHub Container Registry)。
# 发布地址: ghcr.io/<owner>/cc-trans
#
# 触发:
#   1) 打版本标签(推荐):git tag v0.2.0 && git push origin v0.2.0
#      → 发布 0.2.0 / 0.2 / latest / sha-xxxxxxx
#   2) 手动运行(Actions 页 Run workflow):发 latest + sha-xxxxxxx
#      → 用途:改完代码想立刻让各机器 `docker compose pull` 拿到,又还不想打版本号
#      → ⚠️ 它会把 latest 指向这次构建,所有拉 latest 的部署下次 pull 都会跟着走
#      → 只有在 main 上手动运行才动 latest(见下方 enable 条件):从功能分支跑
#        流水线是为了验证流水线本身,把 latest 指到未合并的代码几乎不会是本意
#   平时推 main 【不会】发布镜像 —— 想发就手动运行一次,把时机攥在自己手里。
#
# 用仓库自带的 GITHUB_TOKEN 推送,不需要配任何 secret。
#
# ⚠️ 首次发布后需手动把包设为 Public(GHCR 包默认私有),否则别人 pull 要先 docker login:
#    仓库右侧 Packages → cc-trans → 右下 Package settings(⚙) → Danger Zone → Change visibility → Public
name: Publish Docker image to GHCR

on:
  push:
    tags: ['v*'] # 只在打版本标签时发布
  workflow_dispatch: # 手动跑一次(在 main 上跑会同时更新 latest)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # owner/cc-trans

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推送到 GHCR 必需
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 多架构构建(amd64 + arm64):树莓派 / ARM 云主机 / Apple Silicon 也能直接用。
      # 镜像里只 COPY 源码、不编译原生依赖,所以 QEMU 交叉构建很快。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 生成 tag:
      #   打 v1.2.3            → 1.2.3、1.2、latest、sha-xxxxxxx
      #   打 v1.2.3-rc.1       → 1.2.3-rc.1、sha-xxxxxxx(预发布【不】动 latest)
      #   在 main 上手动运行    → latest、sha-xxxxxxx
      #   在其它分支手动运行    → 只有 sha-xxxxxxx
      #
      # latest 由两条独立规则产出,各管一段,互不干扰:
      #   · flavor 的 latest=auto —— 只在有 semver 且非预发布时加。预发布保护就靠它,
      #     所以【不能】改成 latest=true(那会让 rc 也变成 latest)。
      #   · 下面那条 type=raw —— 补上手动运行这一路(它没有 semver,auto 管不到)。
      #   两条都命中时 metadata-action 会去重,不会产出重复 tag。
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && github.ref_name == (github.event.repository.default_branch || 'main') }}
          labels: |
            org.opencontainers.image.title=cc-trans
            org.opencontainers.image.description=零依赖 Anthropic API 反向代理(转发本机 Claude 订阅)+ Web 管理台
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 复用上次构建缓存,加快后续发布
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 供应链溯源证明(可选能力;失败不影响镜像已发布)
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "### 镜像已发布 🎉" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$TAGS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # 有没有更新 latest 要照实说 —— 预发布和非默认分支的手动运行都不动它,
          # 无条件写"pull latest"会让人以为各机器 pull 一下就能拿到本次构建。
          if printf '%s\n' "$TAGS" | grep -q ':latest$'; then
            echo "本次**已更新 \`latest\`**,各机器 \`docker compose pull && docker compose up -d\` 即可拿到。" >> $GITHUB_STEP_SUMMARY
          else
            echo "本次**未更新 \`latest\`**(预发布标签,或在非默认分支上手动运行)——请按上面的精确 tag 拉取。" >> $GITHUB_STEP_SUMMARY
          fi
