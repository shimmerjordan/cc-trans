<script>
/*__MD__*/
</script>

<script>
// 同一份页面服务两个入口:/u/chat(普通用户)与 /admin/chat(管理员)。
// API 前缀从路径推导,别硬编码 —— 否则要么维护两份页面,要么管理员用不了。
const IS_ADMIN = location.pathname.startsWith('/admin');
const API = IS_ADMIN ? '/admin/api' : '/u/api';
const SESS_KEY = IS_ADMIN ? 'cc-trans-admin' : 'cc-trans-user';
const HOME = IS_ADMIN ? '/admin/overview' : '/u/devices';
const CHAT_PATH = IS_ADMIN ? '/admin/chat' : '/u/chat';
let SESSION = sessionStorage.getItem(SESS_KEY) || '';
let ME = null, META = null;
let curId = null;          // 当前会话 id
let messages = [];         // 当前会话消息
let sessionRows = [];      // 会话列表(服务端返回的索引)
let liveIds = new Set();   // 正在生成中的会话 id
let pendingImgs = [];      // 待发送图片 [{id, mime, url}]
let pendingFiles = [];     // 待发送的 PDF / 文本附件 [{id, kind, name, bytes}]
let editIndex = null;      // 正在改写第几条用户消息
let artifacts = [], artIndex = 0, panelMode = 'preview';
// 当前这条流:reader 用来主动收尾,seq 是收到的最后一个事件序号(重连续传用)
let cur = null;

const el = (id) => document.getElementById(id);
const show = (id, on) => { el(id).hidden = !on; };
const esc = (s) => escapeHtml(String(s == null ? '' : s));

// ── 本地偏好 ──
const PREF = {
  sendMode: 'enter',
  openThink: false,
};
try {
  const raw = localStorage.getItem('cc-chat-prefs');
  if (raw) Object.assign(PREF, JSON.parse(raw));
} catch {}
function savePrefsQuiet() { try { localStorage.setItem('cc-chat-prefs', JSON.stringify(PREF)); } catch {} }
function savePrefs() {
  PREF.sendMode = el('sendMode').value === 'mod' ? 'mod' : 'enter';
  PREF.openThink = el('prefThink').checked;
  savePrefsQuiet();
  applyPlaceholder();
  prefsDlg.close();
}
function applyPlaceholder() {
  // 窄屏只留主干:整句在 390px 下会折成两行,而输入框初始只有一行高 ——
  // 第二行被裁掉一半,看着像坏了。手机上本来也没有 Shift+Enter 这个动作。
  if (window.innerWidth <= 640) {
    el('input').placeholder = '给 Claude 发消息…';
    return;
  }
  const key = PREF.sendMode === 'mod' ? '⌘/Ctrl+Enter 发送' : 'Enter 发送,Shift+Enter 换行';
  el('input').placeholder = `给 Claude 发消息…(${key},可粘贴或拖入图片)`;
}

function toast(msg, kind = 'ok') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.textContent = msg;
  el('toasts').appendChild(t);
  setTimeout(() => t.remove(), 4200);
}

// 原生 confirm 在手机上样式失控、也没法说清后果。自己出一个。
let confirmResolve = null;
function askConfirm(title, body, okLabel = '确定') {
  el('confirmTitle').textContent = title;
  el('confirmBody').textContent = body;
  el('confirmOk').textContent = okLabel;
  confirmDlg.showModal();
  return new Promise((r) => { confirmResolve = r; });
}
function confirmDone(v) {
  confirmDlg.close();
  if (confirmResolve) confirmResolve(v);
  confirmResolve = null;
}

// ── 外观:cc-haha 的六套色板 + 跟随系统 ──
// 用独立的 localStorage 键 cc-chat-theme:/admin 与 /u 仍是原来那套亮/暗二值,
// 共用一个键会让它们读到 "celadon" 这种它们不认识的值。
const THEMES = [
  { id: 'white', name: '纯白', sw: '#FFFFFF' },
  { id: 'paper', name: '纸墨', sw: '#FBF9F4' },
  { id: 'warm-classic', name: '暖旧', sw: '#F6F0E1' },
  { id: 'celadon', name: '青瓷', sw: '#F5F8F5' },
  { id: 'dark', name: '暗色', sw: '#201D17' },
  { id: 'ink-blue', name: '靛墨', sw: '#1A1D24' },
];
const DARK_THEMES = new Set(['dark', 'ink-blue']);
const ICON_SUN = '<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>';
const ICON_MOON = '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>';

function savedTheme() {
  try { return localStorage.getItem('cc-chat-theme') || 'auto'; } catch { return 'auto'; }
}
function systemTheme() {
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'white';
}
function applyTheme(t) {
  const eff = t === 'auto' ? systemTheme() : t;
  document.documentElement.dataset.theme = eff;
  try { t === 'auto' ? localStorage.removeItem('cc-chat-theme') : localStorage.setItem('cc-chat-theme', t); } catch {}
  el('themeIcon').innerHTML = DARK_THEMES.has(eff) ? ICON_MOON : ICON_SUN;
  drawThemePop();
}
function drawThemePop() {
  const cur = savedTheme();
  el('themePop').innerHTML =
    `<button onclick="pickTheme('auto')" class="${cur === 'auto' ? 'on' : ''}">
       <span class="sw" style="background:linear-gradient(135deg,#FFFFFF 50%,#201D17 50%)"></span>跟随系统</button><hr />` +
    THEMES.map((t) =>
      `<button onclick="pickTheme('${t.id}')" class="${cur === t.id ? 'on' : ''}">
         <span class="sw" style="background:${t.sw}"></span>${t.name}</button>`).join('');
}
function pickTheme(t) { applyTheme(t); el('themePop').hidden = true; }
function toggleThemePop() {
  const p = el('themePop');
  p.hidden = !p.hidden;
  if (!p.hidden) drawThemePop();
}
// 跟随系统时,系统换了要跟着换
if (window.matchMedia) {
  try {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (savedTheme() === 'auto') applyTheme('auto');
    });
  } catch { /* 老浏览器没有 addEventListener,跟随失效但不影响手选 */ }
}
// 同样走 capture:drawThemePop() 也会重画 innerHTML,冒泡阶段拿到的 target 已脱落
document.addEventListener(
  'click',
  (e) => {
    const p = el('themePop');
    if (!p || p.hidden) return;
    if (!e.target.closest('#themePop') && !e.target.closest('[onclick="toggleThemePop()"]')) p.hidden = true;
  },
  true,
);

async function api(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, headers: { 'content-type': 'application/json', ...(opts.headers || {}), authorization: 'Bearer ' + SESSION } });
  if (r.status === 401) { toLogin(); throw new Error('unauthorized'); }
  return r;
}
function toLogin() {
  SESSION = ''; sessionStorage.removeItem(SESS_KEY);
  show('app', false); show('loginView', true); el('pw').focus();
}
async function doLogin() {
  el('loginErr').textContent = '';
  const r = await fetch(API + '/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username: el('user').value, password: el('pw').value }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    // 走错门:服务端已经验过密码,所以这句话可以说得很具体(见 admin.js / user.js)
    if (r.status === 409 && d.redirect) {
      el('loginErr').innerHTML = esc(d.error) + ` · <a href="${esc(d.redirect)}">去那边登录</a>`;
      return;
    }
    el('loginErr').textContent = d.error || '登录失败';
    return;
  }
  SESSION = d.session; sessionStorage.setItem(SESS_KEY, SESSION);
  el('pw').value = ''; boot();
}
async function logout() {
  try { await api('/logout', { method: 'POST' }); } catch {}
  toLogin();
}
el('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

// ── 布局开关 ──
// 手机上侧栏是覆盖层:开关按钮在主区左上角、会被侧栏盖住,所以【打开的同时必须
// 备好三条退路】—— 点遮罩、点侧栏里的 ✕、按 Esc。少任何一条都可能关不掉。
function toggleSide(force) {
  const s = el('side');
  if (window.innerWidth <= 900) {
    const open = force === undefined ? !s.classList.contains('open') : !!force;
    s.classList.toggle('open', open);
    el('sideScrim').hidden = !open;
    document.body.classList.toggle('no-scroll', open);
  } else {
    el('app').classList.toggle('rail', force === undefined ? !el('app').classList.contains('rail') : !force);
  }
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (!el('lightbox').hidden) { closeLightbox(); return; }
    if (window.innerWidth <= 900 && el('panel') && !el('panel').hidden) { togglePanel(false); return; }
    if (el('side').classList.contains('open')) { toggleSide(false); return; }
    if (editIndex !== null) { cancelEdit(); return; }
  }
  // ⌘K / Ctrl+K:直接跳到搜索框。会话一多,这是最常用的动作
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (window.innerWidth <= 900) toggleSide(true);
    else el('app').classList.remove('rail');
    el('find').focus(); el('find').select();
  }
  // ⌘⇧O:新对话(与常见约定一致)
  if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === 'o') {
    e.preventDefault(); newChat();
  }
});
addEventListener('resize', () => {
  if (window.innerWidth > 900 && el('side').classList.contains('open')) {
    el('side').classList.remove('open');
    el('sideScrim').hidden = true;
    document.body.classList.remove('no-scroll');
  }
  applyPlaceholder(); // 提示语按宽度分档,转屏后要跟上
});
function togglePanel(force) {
  const on = force === undefined ? !el('app').classList.contains('with-panel') : force;
  el('app').classList.toggle('with-panel', on);
  show('panel', on);
}

// ── 公告 ──
function drawNotice(a) {
  if (!a || !a.text) { show('notice', false); return; }
  let dismissed = '';
  try { dismissed = localStorage.getItem('cc-chat-notice') || ''; } catch {}
  const fp = String(a.updatedAt || 0) + ':' + a.text.length;
  if (dismissed === fp) { show('notice', false); return; }
  el('notice').className = 'notice ' + (a.level === 'warn' || a.level === 'err' ? a.level : '');
  el('noticeText').textContent = a.text;
  el('notice').dataset.fp = fp;
  show('notice', true);
}
function dismissNotice() {
  try { localStorage.setItem('cc-chat-notice', el('notice').dataset.fp || ''); } catch {}
  show('notice', false);
}

// ── 会话列表 ──
function ago(ts) {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  if (s < 86400 * 7) return Math.floor(s / 86400) + ' 天前';
  return new Date(ts).toLocaleDateString('zh-CN');
}
function dayGroup(ts) {
  const d = new Date(ts), n = new Date();
  const midnight = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime();
  if (ts >= midnight) return '今天';
  if (ts >= midnight - 86400000) return '昨天';
  if (ts >= midnight - 86400000 * 6) return '本周';
  if (d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth()) return '本月';
  return '更早';
}

// ── 用量 ────────────────────────────────────────────────────────────────
// 两层口径,给哪一层是【服务端】决定的(见 user.js /api/quota):管理员给你设了
// 配额就看自己的额度,没设就看账户整体的订阅额度 —— 后者才是没有个人限额时
// 真正会撞上的那道墙。前端只画,不猜:有配额时响应里根本没有 account 字段。
let USAGE = null;

function usdText(v) { return '$' + (v >= 100 ? v.toFixed(0) : v >= 1 ? v.toFixed(2) : v.toFixed(4)); }
function sevCls(sev, pct) {
  const s = sev || (pct >= 95 ? 'critical' : pct >= 80 ? 'warn' : 'normal');
  return s === 'critical' ? 'err' : s === 'warn' ? 'warn' : '';
}
function resetText(ts) {
  if (!ts) return '';
  const d = ts - Date.now();
  if (d <= 0) return '已重置';
  const h = Math.floor(d / 3600000), m = Math.round((d % 3600000) / 60000);
  return h >= 24 ? `${Math.round(h / 24)} 天后重置` : h ? `${h} 小时${m ? m + ' 分' : ''}后重置` : `${Math.max(1, m)} 分钟后重置`;
}
function ubar(b) {
  const pct = Math.max(0, Math.min(100, Math.round(b.percent || 0)));
  const cls = sevCls(b.severity, pct);
  const bits = [];
  // used/limit 可能是 null —— 管理员关掉了「查看成本金额」权限。这时只给百分比:
  // 比例不泄露金额,而"我还剩多少"必须仍然答得出来。
  if (b.used != null && b.limit != null) {
    bits.push(b.kind === 'cost' ? `${usdText(b.used)} / ${usdText(b.limit)}` : `${fmtNum(b.used)} / ${fmtNum(b.limit)}`);
  }
  if (b.resetsAt) bits.push(resetText(b.resetsAt));
  if (b.isActive) bits.push('当前生效');
  if (b.status && String(b.status).toLowerCase() !== 'allowed') bits.push(esc(String(b.status)));
  return `<div class="ubar">
    <div class="r1"><b>${esc(b.label || '')}</b><span class="p ${cls}">${pct}%</span></div>
    <div class="tr"><i class="${cls}" style="width:${pct}%"></i></div>
    ${bits.length ? `<div class="sub">${bits.join(' · ')}</div>` : ''}
  </div>`;
}

async function loadUsage(fromDialog = false) {
  const btn = el('usageRefresh');
  if (fromDialog && btn) { btn.disabled = true; btn.textContent = '刷新中…'; }
  try {
    USAGE = await (await api('/quota')).json();
  } catch {
    USAGE = null;
  } finally {
    if (fromDialog && btn) { btn.disabled = false; btn.textContent = '刷新'; }
  }
  drawUsageStrip();
  if (usageDlg.open || fromDialog) drawUsage();
}

// 侧栏那一行:只画【最紧的那一个数】。两层口径下"最紧"的含义不同,所以标签也不同。
function drawUsageStrip() {
  const strip = el('usageStrip');
  if (!USAGE) { strip.hidden = true; return; }
  let label = '用量', pct = null;
  if (USAGE.scope === 'user' && (USAGE.mine.bars || []).length) {
    const top = USAGE.mine.bars.reduce((a, b) => (b.percent > a.percent ? b : a));
    label = top.label; pct = top.percent;
  } else if (USAGE.scope === 'account' && USAGE.account && USAGE.account.available && (USAGE.account.bars || []).length) {
    const top = USAGE.account.bars.reduce((a, b) => (b.percent > a.percent ? b : a));
    label = top.label; pct = top.percent;
  } else if (USAGE.mine && !USAGE.mine.admin) {
    // 既没有个人额度、也拿不到账户额度:那就报自己这段时间用了多少 —— 总比什么都不说好
    label = `${USAGE.mine.windowLabel || ''}已用 ${fmtNum(USAGE.mine.usedTokens || 0)}`;
  }
  const cls = pct == null ? '' : sevCls(null, pct);
  el('usageStripLabel').textContent = label;
  el('usageStripTrack').hidden = pct == null;
  el('usageStripFill').style.width = (pct == null ? 0 : pct) + '%';
  el('usageStripFill').className = cls;
  el('usageStripPct').textContent = pct == null ? '' : pct + '%';
  el('usageStripPct').className = 'up ' + cls;
  strip.hidden = false;
}

function drawUsage() {
  const box = el('usageBody'), note = el('usageNote');
  if (!USAGE) { box.innerHTML = '<p class="muted">读不到用量(网络或会话问题)。</p>'; note.textContent = ''; return; }
  const m = USAGE.mine || {};
  const html = [];
  // 1) 我用了多少(这一层永远看得到 —— 它是自己的数据)
  if (!m.admin) {
    const nums = [`<span>${esc(m.windowLabel || '')}已用 <b>${fmtNum(m.usedTokens || 0)}</b> token</span>`,
                  `<span>请求 <b>${fmtNum(m.requests || 0)}</b> 次</span>`];
    if (m.usedCost != null) nums.push(`<span>估算 <b>${usdText(m.usedCost)}</b></span>`);
    html.push('<div class="u-head">我的用量</div>');
    html.push(`<div class="u-nums">${nums.join('')}</div>`);
    html.push(`<p class="muted" style="font-size:var(--fs-stamp);margin:0">口径 = 输入+输出 token,不含缓存读;${m.deviceCount ? `与你名下 ${m.deviceCount} 台设备共享` : '你名下还没有设备'}。金额按模型定价估算,非账单。</p>`);
  }
  // 2) 额度:有个人配额就看个人的,否则看账户整体的
  if (USAGE.scope === 'user') {
    html.push('<div class="u-head">我的额度</div>');
    html.push((m.bars || []).map(ubar).join('') || '<p class="muted">管理员没给你设上限。</p>');
    html.push('<p class="muted" style="font-size:var(--fs-stamp);margin:0">这是管理员给你单独设的额度,用尽后请求会被拒(429),到下一个窗口自动恢复。</p>');
  } else {
    const a = USAGE.account || {};
    html.push('<div class="u-head">账户整体额度</div>');
    if (m.admin) html.push('<p class="muted" style="font-size:var(--fs-stamp);margin:0 0 var(--s2)">管理员不受用户级配额限制,这里是整个订阅账户的额度。</p>');
    if (a.available) {
      if (a.alert && a.alert.exhausted) {
        html.push(`<div class="u-alert"><b>⚠️ 额外用量额度已用尽</b>${a.alert.reason ? ' · ' + esc(a.alert.reason) : ''}
          <div style="margin-top:4px;color:var(--color-text-secondary)">上面那几个窗口还有余量时,请求也可能被上游拒成 <code>529 Overloaded</code> —— 官方那句报错只说 "Overloaded",看不出是账户的消费上限满了。要解决得由订阅的管理员去提高上限或等额度周期重置。</div></div>`);
      } else if (a.alert && a.alert.percent > 0) {
        html.push(ubar({ label: '额外用量额度', percent: a.alert.percent, severity: a.alert.severity,
          used: a.spend ? a.spend.used && a.spend.used.amount : null, limit: a.spend ? a.spend.limit && a.spend.limit.amount : null, kind: 'cost' }));
      } else if (a.alert && !a.alert.enabled) {
        // 实测真实账号会回 percent=0 + disabled_reason=out_of_credits。画一根 0% 的条
        // 会被读成"还有余量",而事实是压根没有这份兜底 —— 两种状态必须分得开。
        html.push(`<p class="muted" style="font-size:var(--fs-stamp);margin:0 0 var(--s2)">额外用量额度:<b>不可用</b>${a.alert.reason ? '(' + esc(a.alert.reason) + ')' : ''} —— 上面的窗口用尽后没有兜底额度,只能等窗口重置。</p>`);
      }
      html.push((a.bars || []).map(ubar).join(''));
    } else {
      html.push(`<p class="muted">${esc(a.reason || '暂无数据')}</p>`);
    }
  }
  box.innerHTML = html.join('');
  const a = USAGE.account;
  note.innerHTML = USAGE.scope === 'user'
    ? '额度与你名下所有设备共享,不是每台设备各一份。'
    : a && a.available
      ? (a.source === 'oauth'
          ? `数据来自订阅用量接口(与 Claude Code 的 <code>/usage</code> 同源),服务端缓存 ${Math.round((a.ttlMs || 0) / 60000)} 分钟以免把上游问出 429${a.fetchedAt ? ' · 更新于 ' + esc(ago(a.fetchedAt)) : ''}`
          : `数据来自最近一次转发响应里的上游限额头${a.fetchedAt ? '(' + esc(ago(a.fetchedAt)) + ')' : ''}${a.upstreamStatus ? ' · 上游状态 ' + esc(a.upstreamStatus) : ''}`)
      : '';
}

function openUsage() {
  drawUsage();
  usageDlg.showModal();
  loadUsage(true); // 打开时顺手刷一次,拿到的可能比侧栏那份新
}

async function loadSessions() {
  const d = await (await api('/chat/sessions')).json();
  sessionRows = d.sessions || [];
  liveIds = new Set((d.live || []).map((l) => l.sessionId));
  drawSessions();
  if (d.stats) {
    const n = d.stats.sessions, cap = d.stats.maxSessions;
    const near = cap > 0 && n >= cap * 0.8;
    const meta = el('whoMeta');
    meta.textContent = near ? `· ${n}/${cap} 对话` : `· ${n} 个对话`;
    meta.classList.toggle('near-cap', near);
    // 上限是【磁盘保护】不是额度(超了删最旧的,不拒请求,管理员一样受约束),
    // 所以平时只报条数 —— 写成 "0/200" 摆在名字旁边,长得就像个额度徽标。
    meta.title = cap > 0
      ? `已保存 ${n} 个对话。超过 ${cap} 个时自动删掉最旧的 —— 这是磁盘保护,不是额度限制。上限可在 config.json 的 chatMaxSessions 里调,0 = 不限。`
      : `已保存 ${n} 个对话(未设上限)。`;
  }
}

function drawSessions() {
  const q = el('find').value.trim().toLowerCase();
  const rows = q
    ? sessionRows.filter((s) => (s.title || '').toLowerCase().includes(q) || (s.preview || '').toLowerCase().includes(q))
    : sessionRows;
  if (!rows.length) {
    el('sessions').innerHTML = `<div class="sess-empty">${q ? '没有匹配的对话' : '还没有对话'}</div>`;
    return;
  }
  let html = '';
  let lastGrp = '';
  for (const s of rows) {
    // 置顶单独一组:它们不该按时间散落在各组里
    const grp = s.pinned ? '置顶' : dayGroup(s.updatedAt || s.createdAt || 0);
    if (grp !== lastGrp) { html += `<div class="grp">${esc(grp)}</div>`; lastGrp = grp; }
    const live = liveIds.has(s.id);
    html += `<div class="sess ${s.id === curId ? 'active' : ''}" data-id="${esc(s.id)}" title="${esc(s.title || '新对话')}${s.preview ? '\n' + esc(s.preview) : ''}">
      ${s.pinned ? '<span class="pin" aria-label="已置顶">★</span>' : ''}
      ${live ? '<span class="dot" title="正在生成中"></span>' : ''}
      <span class="txt">
        <span class="t">${esc(s.title || '新对话')}</span>
        ${s.preview ? `<span class="p">${esc(s.preview)}</span>` : ''}
      </span>
      <span class="acts">
        <button data-act="pin" title="${s.pinned ? '取消置顶' : '置顶'}">${s.pinned ? '☆' : '★'}</button>
        <button data-act="rename" title="重命名">✎</button>
        <button data-act="del" title="删除">🗑</button>
      </span></div>`;
  }
  el('sessions').innerHTML = html;
}

// 列表用事件委托:innerHTML 里塞 onclick 又要转义又容易注入,委托一次就够
el('sessions').addEventListener('click', (e) => {
  const row = e.target.closest('.sess');
  if (!row) return;
  const id = row.dataset.id;
  const btn = e.target.closest('button[data-act]');
  if (!btn) { openChat(id); return; }
  e.stopPropagation();
  const act = btn.dataset.act;
  if (act === 'rename') askRename(id);
  else if (act === 'del') delChat(id);
  else if (act === 'pin') togglePin(id);
});

let renameId = null;
function askRename(id) {
  const row = sessionRows.find((s) => s.id === id);
  renameId = id;
  el('renameInput').value = (row && row.title) || '';
  renameDlg.showModal();
  el('renameInput').select();
}
async function renameCommit() {
  const title = el('renameInput').value.trim();
  renameDlg.close();
  if (!renameId) return;
  await api('/chat/session/rename', { method: 'POST', body: JSON.stringify({ id: renameId, title }) });
  renameId = null;
  loadSessions();
}
el('renameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); renameCommit(); } });

async function togglePin(id) {
  const row = sessionRows.find((s) => s.id === id);
  await api('/chat/session/pin', { method: 'POST', body: JSON.stringify({ id, pinned: !(row && row.pinned) }) });
  loadSessions();
}
async function delChat(id) {
  const row = sessionRows.find((s) => s.id === id);
  if (!await askConfirm('删除对话', `删除「${(row && row.title) || '新对话'}」?不可恢复。`, '删除')) return;
  await api('/chat/session/remove', { method: 'POST', body: JSON.stringify({ id }) });
  if (id === curId) newChat(); else loadSessions();
}

function newChat() {
  endStream();
  curId = null; messages = []; artifacts = []; editIndex = null;
  togglePanel(false); show('resumed', false); show('editingBar', false);
  restoreDraft();
  render(); loadSessions();
  el('input').focus();
  history.replaceState({}, '', CHAT_PATH);
  if (window.innerWidth <= 900) toggleSide(false);
}

async function openChat(id) {
  if (id === curId && !cur) return;
  saveDraft();
  endStream();
  const r = await api('/chat/session?id=' + encodeURIComponent(id));
  if (!r.ok) { toast('会话打开失败', 'err'); return; }
  const d = await r.json();
  curId = d.session.id;
  messages = d.session.messages || [];
  editIndex = null; show('editingBar', false);
  if (d.session.model) setModel(d.session.model);
  history.replaceState({}, '', CHAT_PATH + '?c=' + encodeURIComponent(curId));
  restoreDraft();
  render(); drawContext(d.context); loadSessions(); refreshArtifacts();
  if (window.innerWidth <= 900) toggleSide(false);
  // 服务端还在生成这条 —— 接回去。这是断线保活的收口:刷新页面、换台设备,
  // 甚至锁屏十分钟回来,那条回答还在往下写。
  if (d.live) attach(d.live.seq, true);
  else show('resumed', false);
}

// ── 草稿:每个会话一份,切走再切回来还在 ──
const draftKey = () => 'cc-chat-draft:' + (curId || '_new');
function saveDraft() {
  try {
    const v = el('input').value;
    if (v.trim()) localStorage.setItem(draftKey(), v);
    else localStorage.removeItem(draftKey());
  } catch {}
}
function restoreDraft() {
  let v = '';
  try { v = localStorage.getItem(draftKey()) || ''; } catch {}
  el('input').value = v;
  autoGrow();
}
addEventListener('beforeunload', saveDraft);

// ── 上下文占用 ──
let lastCtx = null;
function drawContext(ctx) {
  lastCtx = ctx || null;
  if (!ctx || !ctx.window || !ctx.used) { show('ctxChip', false); return; }
  const pct = Math.max(0, Math.min(100, ctx.percent || 0));
  const C = 2 * Math.PI * 7.5;
  el('ctxArc').setAttribute('stroke-dasharray', C.toFixed(1));
  el('ctxArc').setAttribute('stroke-dashoffset', (C * (1 - pct / 100)).toFixed(1));
  // 不到 1% 时报 token 数而不是「0.0%」:后者既没信息量,又像是坏了。
  // 到了有意义的量级再切成百分比 —— 那时人关心的才是"离满还有多远"。
  el('ctxPct').textContent = pct >= 1 ? Math.round(pct) + '%' : fmtNum(ctx.used) + ' tok';
  el('ctxChip').classList.toggle('warn', pct >= 70);
  el('ctxChip').title = `上下文已用 ${fmtNum(ctx.used)} / ${fmtNum(ctx.window)} token（${ctx.source === 'measured' ? '来自上游实际用量' : '按字数估算'}）`;
  show('ctxChip', true);
}
function explainCtx() {
  if (!lastCtx) return;
  const pct = Math.round(lastCtx.percent || 0);
  toast(
    `这段对话已占用上下文 ${fmtNum(lastCtx.used)} / ${fmtNum(lastCtx.window)} token(${pct}%)。` +
      (pct >= 70 ? ' 越长越慢越贵 —— 换个话题时开新对话更划算。' : ' 数字来自' + (lastCtx.source === 'measured' ? '上游实际用量。' : '字数估算。')),
  );
}

// ── 渲染 ──
function fmtNum(n) { n = n || 0; return n < 1000 ? String(n) : n < 1e6 ? (n / 1e3).toFixed(1) + 'k' : (n / 1e6).toFixed(1) + 'M'; }
function fmtMs(ms) {
  if (!ms || ms < 0) return '';
  if (ms < 1000) return ms + 'ms';
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
  const m = Math.floor(ms / 60000);
  return `${m}分${Math.round((ms % 60000) / 1000)}秒`;
}

// 思考过程折叠行里的那句尾巴。流式时跟最后一行(此刻在想什么),
// 定稿后取第一行(它是这段推理的概括);第一行只是个冒号标题时取下一行。
function thinkTail(text, streaming) {
  const lines = String(text || '')
    .split('\n')
    .map((l) => l.trim().replace(/^#{1,6}\s+/, '').replace(/^[-*+]\s+/, '').replace(/^>\s*/, '').replace(/^\d+\.\s+/, '').trim())
    .filter((l) => l && l !== '---');
  if (!lines.length) return '';
  let picked;
  if (streaming) picked = lines[lines.length - 1];
  else {
    const first = lines[0];
    picked = first.length <= 24 && /[:：]$/.test(first) ? (lines[1] || first) : first;
  }
  return picked.length > 160 ? picked.slice(0, 160) + '…' : picked;
}

function renderMsg(m, i, isLast) {
  const acts = [];
  if (m.content) acts.push(`<button data-act="copy" data-i="${i}" title="复制这条">复制</button>`);
  if (m.role === 'user') {
    acts.push(`<button data-act="edit" data-i="${i}" title="改写这条提问并重新发送">改写</button>`);
  } else {
    acts.push(`<button data-act="fork" data-i="${i}" title="从这里分出一个新对话,原对话保留">分叉</button>`);
    if (isLast) acts.push(`<button data-act="regen" title="重新生成">重新生成</button>`);
  }
  const stampBits = [];
  if (m.ts) stampBits.push(new Date(m.ts).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }));
  if (m.role === 'assistant' && m.ms) stampBits.push('用时 ' + fmtMs(m.ms));
  const stamp = stampBits.length
    ? `<span class="stamp" title="${m.ts ? esc(new Date(m.ts).toLocaleString('zh-CN')) : ''}">${esc(stampBits.join(' · '))}</span>`
    : '';
  const actsRow = `<div class="acts-row">${acts.join('')}${stamp}</div>`;

  if (m.role === 'user') {
    const imgs = (m.images || [])
      .map((im) => `<img src="${API}/chat/image?id=${encodeURIComponent(im.id)}&s=${encodeURIComponent(SESSION)}" alt="附图" data-zoom="1" />`)
      .join('');
    const atts = (m.files || []).map((f) =>
      `<a class="att" href="${API}/chat/file?id=${encodeURIComponent(f.id)}&name=${encodeURIComponent(f.name || '')}&s=${encodeURIComponent(SESSION)}"
         target="_blank" rel="noopener" title="${esc(f.name || '')}">
        ${svg(ICO.file, '')}<span class="nm">${esc(f.name || f.id)}</span></a>`).join('');
    // 底已经是 white-space: pre-wrap,换行不用再转成 <br>
    return `<div class="msg user ${isLast ? 'last' : ''}" data-i="${i}"><div class="col">
      ${imgs ? `<div class="imgs">${imgs}</div>` : ''}
      ${atts ? `<div class="atts">${atts}</div>` : ''}
      ${m.content ? `<div class="bubble">${esc(m.content)}</div>` : ''}
      ${actsRow}</div></div>`;
  }

  const think = m.thinking
    ? `<details class="think"${PREF.openThink ? ' open' : ''}><summary>
        <span class="lbl">已思考</span>
        <span class="tail">${esc(thinkTail(m.thinking, false))}</span>
        <span class="caret" aria-hidden="true">▸</span>
      </summary><div class="tbody">${esc(m.thinking)}</div></details>`
    : '';
  const body = m.content ? renderMarkdown(m.content) : '';
  const research = renderResearch(m);
  const cites = renderCites(m);
  const u = m.usage || {};
  const bits = [];
  if (m.model) bits.push(esc(m.model));
  if (u.output) bits.push(`in ${fmtNum(u.input)} / out ${fmtNum(u.output)}${u.cacheRead ? ' / 缓存 ' + fmtNum(u.cacheRead) : ''}`);
  if (m.stopped) bits.push('你点了停止');
  if (m.disconnected) bits.push('断线超时,已保留生成到此处的内容');
  return `<div class="msg assistant ${isLast ? 'last' : ''}" data-i="${i}">
    <div class="who">Claude${bits.length ? ' · ' + bits.join(' · ') : ''}</div>
    ${think}
    ${research}
    <div class="body">${body}</div>
    ${cites}
    ${m.error ? `<div class="err">${esc(m.error)}</div>` : ''}
    ${actsRow}</div>`;
}

// 会话抬头。cc-haha 每个会话最上面是"衬线大标题 + 条数/最后更新/模型"这一行,
// 它替代了原来那条塞满选择器的顶栏。
function drawHead() {
  const row = sessionRows.find((x) => x.id === curId);
  const title = (row && row.title) || (curId ? '新对话' : '新的会话');
  el('chatTitle').textContent = title;
  el('chatTitle').title = title;
  const bits = [];
  if (cur) bits.push('<span class="liveflag">生成中</span>');
  if (messages.length) bits.push(esc(messages.length + ' 条消息'));
  if (row && row.updatedAt) bits.push('最后更新 ' + esc(ago(row.updatedAt)));
  let html = bits.join('<span class="sep">·</span>');
  // 模型名连同它前面那个分隔点一起包进 .mdl:窄屏只要隐掉这个 span,
  // 就不会留下一个孤零零的「·」(CSS 选不到"前一个兄弟")
  const mdl = el('model').value;
  if (mdl) html += `<span class="mdl">${bits.length ? '<span class="sep">·</span>' : ''}${esc(mdl)}</span>`;
  el('chatMeta').innerHTML = html;
}

// 联网这一轮查了什么。折叠一行,点开看查询词与命中的页面 ——
// "它到底搜了没有、搜的是什么"是联网回答里最该能核对的一件事。
function renderResearch(m) {
  const qs = m.queries || [];
  const src = m.sources || [];
  if (!qs.length && !src.length) return '';
  const label = m.mode === 'research' ? '深度研究' : '联网检索';
  const rows =
    qs.map((q) => `<div class="q">${esc(q)}</div>`).join('') +
    src.map((x) => {
      let host = '';
      try { host = new URL(x.url).host.replace(/^www\./, ''); } catch {}
      return `<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">
        <span class="host">${esc(host)}</span><span class="ttl">${esc(x.title || x.url)}</span></a>`;
    }).join('');
  return `<details class="research"><summary>
      ${svg(ICO.globe)}${esc(label)} · 检索 ${qs.length} 次,命中 ${src.length} 个来源
      <span class="caret" aria-hidden="true">▸</span>
    </summary><div class="rbody">${rows}</div></details>`;
}

// 正文末尾的来源清单。优先用模型自己给的 citations(它明确引了谁),
// 没有引用就退回这一轮搜到的全部来源。
function renderCites(m) {
  const list = (m.citations && m.citations.length ? m.citations : m.sources) || [];
  if (!list.length) return '';
  return `<div class="cites"><div class="lbl">${m.citations && m.citations.length ? '引用来源' : '检索到的来源'}</div><ol>` +
    list.map((x, i) => {
      let host = '';
      try { host = new URL(x.url).host.replace(/^www\./, ''); } catch {}
      return `<li><span class="n">${i + 1}</span><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" title="${esc(x.title || x.url)}">${esc(x.title || host || x.url)}</a></li>`;
    }).join('') + '</ol></div>';
}

function render() {
  drawHead();
  if (!messages.length) {
    el('msgs').innerHTML = `<div class="empty"><b>开始一段对话</b>
      <div class="sub">这里的请求会通过本机的 Claude 订阅转发,用量记在你选的那台设备名下(可在「我的设备」查看)。</div>
      <div class="chips">
        <button data-fill="用一句话解释 CAP 定理">解释一个概念</button>
        <button data-fill="帮我写一个 Node 的 LRU 缓存,带测试">写代码</button>
        <button data-fill="做一个可交互的 HTML 柱状图 demo">做个可预览的页面</button>
      </div></div>`;
      drawNav();
    return;
  }
  const lastAssistant = messages.reduce((acc, m, i) => (m.role === 'assistant' ? i : acc), -1);
  el('msgs').innerHTML = messages.map((m, i) => renderMsg(m, i, i === lastAssistant || i === messages.length - 1)).join('') + statusHtml();
  bindCodeButtons();
  drawNav();
  scrollDown();
}

// 生成中的状态行:动词 + 已用时 + 已出 token
function statusHtml() {
  if (!cur) return '';
  if (cur.retry) {
    return `<div class="retry-bar" role="status">
      <span aria-hidden="true">↻</span>
      <b>上游繁忙,正在重试</b>
      <span class="tag">第 ${cur.retry.attempt}/${cur.retry.max} 次</span>
      ${cur.retry.status ? `<span class="tag">HTTP ${cur.retry.status}</span>` : ''}
      <span>${esc(cur.retry.message || '').slice(0, 120)}</span>
    </div>`;
  }
  const secs = Math.floor((Date.now() - cur.startedAt) / 1000);
  const tok = Math.round((cur.chars || 0) / 4);
  const verb = cur.searching || (cur.thinkingNow ? '思考中' : '生成中');
  return `<div class="turn-status" id="turnStatus" role="status" aria-live="polite">
    <span class="spark" aria-hidden="true">✦</span>
    <b>${esc(verb)}<span class="dots"></span></b>
    <span class="num">${secs}s</span>
    ${tok > 0 ? `<span aria-hidden="true">·</span><span class="num">↓ ${fmtNum(tok)} tok</span>` : ''}
  </div>`;
}
let statusTimer = null;
function tickStatus() {
  const node = el('turnStatus');
  if (!cur || !node) return;
  const secs = Math.floor((Date.now() - cur.startedAt) / 1000);
  const tok = Math.round((cur.chars || 0) / 4);
  const nums = node.querySelectorAll('.num');
  if (nums[0]) nums[0].textContent = secs + 's';
  if (nums[1]) nums[1].textContent = '↓ ' + fmtNum(tok) + ' tok';
  else if (tok > 0) { const s = document.createElement('span'); s.className = 'num'; s.textContent = '↓ ' + fmtNum(tok) + ' tok'; node.appendChild(s); }
  const b = node.querySelector('b');
  if (b) b.firstChild.textContent = cur.searching || (cur.thinkingNow ? '思考中' : '生成中');
}

// 空态那三个建议按钮 + 图片放大,都走委托
el('msgs').addEventListener('click', (e) => {
  const fill = e.target.closest('[data-fill]');
  if (fill) { el('input').value = fill.dataset.fill; autoGrow(); send(); return; }
  const zoom = e.target.closest('img[data-zoom]');
  if (zoom) { openLightbox(zoom.src); return; }
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const i = Number(btn.dataset.i);
  const act = btn.dataset.act;
  if (act === 'copy') copyMsg(i);
  else if (act === 'edit') startEdit(i);
  else if (act === 'fork') forkAt(i);
  else if (act === 'regen') regen();
});

function copyMsg(i) {
  const m = messages[i];
  if (!m) return;

async function forkAt(i) {
  if (!curId) return;
  const r = await api('/chat/session/fork', { method: 'POST', body: JSON.stringify({ id: curId, upto: i }) });
  const d = await r.json();
  if (!r.ok || !d.ok) { toast(d.error || '分叉失败', 'err'); return; }
  toast('已分叉出新对话,原对话保留');
  await loadSessions();
  openChat(d.session.id);
}

// 指针附近的标记加宽(cc-haha 的"波纹"):细条本身只有 2px 高,
// 没有这个反馈根本不知道自己指到了哪一条
el('navLane').addEventListener('pointermove', (e) => {
  const btns = [...el('navLane').querySelectorAll('button')];
  const hit = e.target.closest('button');
  const at = hit ? Number(hit.dataset.k) : null;
  btns.forEach((b, k) => {
    const d = at === null ? 99 : Math.abs(k - at);
    const w = d >= 2 ? 7 : 7 + (22 - 7) * Math.sin((1 - d / 2) * Math.PI / 2) ** 2;
    b.firstElementChild.style.width = w.toFixed(1) + 'px';
  });
  if (hit) {
    const it = navItems[Number(hit.dataset.k)];
    const r = hit.getBoundingClientRect();
    const tip = el('navTip');
    tip.textContent = it.text;
    tip.hidden = false;
    tip.style.left = r.right + 8 + 'px';
    tip.style.top = Math.min(window.innerHeight - 110, Math.max(12, r.top - 20)) + 'px';
  } else el('navTip').hidden = true;
});
el('navLane').addEventListener('pointerleave', () => {
  el('navTip').hidden = true;
  el('navLane').querySelectorAll('button i').forEach((i) => (i.style.width = '7px'));
});
el('navLane').addEventListener('click', (e) => {
  const hit = e.target.closest('button');

// 代码块的「复制」与「在侧栏打开」——事件委托后绑定,避免 innerHTML 里塞 onclick
function bindCodeButtons() {
  el('msgs').querySelectorAll('.code-block').forEach((blk) => {
    const copyBtn = blk.querySelector('[data-copy]');
    if (copyBtn && !copyBtn.dataset.bound) {

          .then(() => toast('已复制代码')).catch(() => toast('复制失败', 'err'));
      };

// ── Artifacts ──
function refreshArtifacts() {
  const all = [];
  messages.forEach((m) => {
    if (m.role !== 'assistant' || !m.content) return;
    for (const a of extractArtifacts(m.content)) all.push(a);
  });
  artifacts = all;
  show('panelBtn', artifacts.length > 0);
  if (!artifacts.length) togglePanel(false);
  // 标签前加序号:同一段对话里反复给同一份代码时,标题会一模一样
  // (「js · 20 行」两个并排),没有序号就分不出点的是哪一个
  el('pTabs').innerHTML = artifacts.map((a, i) =>
    `<button class="${i === artIndex ? 'on' : ''}" onclick="openArtifact(${i})">${artifacts.length > 1 ? i + 1 + '. ' : ''}${esc(a.title)}</button>`).join('');
  bindCodeButtons();
}
function openArtifact(i) {
  if (!artifacts[i]) return;
  artIndex = i;
  const a = artifacts[i];
  panelMode = a.kind === 'preview' ? 'preview' : 'src';
  togglePanel(true);
  drawPanel();
  refreshArtifacts();
}
function setPanelMode(m) { panelMode = m; drawPanel(); }
function drawPanel() {
  const a = artifacts[artIndex];
  if (!a) return;
  el('pTitle').textContent = a.title;
  el('pMode').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.mode === panelMode));
  el('pMode').querySelector('[data-mode=preview]').disabled = a.kind !== 'preview';
  if (panelMode === 'preview' && a.kind === 'preview') {
    // 沙箱:给 allow-scripts 但【绝不】给 allow-same-origin —— 两个一起给等于没有沙箱。
    // 用 srcdoc 注入,预览内容拿不到本页 DOM、cookie、localStorage。
    const f = document.createElement('iframe');
    f.setAttribute('sandbox', 'allow-scripts allow-forms allow-popups');
    f.setAttribute('referrerpolicy', 'no-referrer');
    f.srcdoc = a.lang === 'svg' ? `<body style="margin:0;display:grid;place-items:center;min-height:100vh">${a.code}</body>` : a.code;
    el('pBody').innerHTML = '';
    el('pBody').appendChild(f);
  } else {
    el('pBody').innerHTML = `<pre class="src"><code>${highlight(a.code, a.lang)}</code></pre>`;
  }
}
function copyArtifact() {
  const a = artifacts[artIndex];
  if (!a) return;
  navigator.clipboard.writeText(a.code).then(() => toast('已复制')).catch(() => toast('复制失败', 'err'));
}
function downloadArtifact() {
  const a = artifacts[artIndex];
  if (!a) return;
  const ext = { html: 'html', svg: 'svg', js: 'js', ts: 'ts', python: 'py', py: 'py', json: 'json', css: 'css', sql: 'sql', bash: 'sh' }[a.lang] || 'txt';
  const blob = new Blob([a.code], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `artifact-${artIndex + 1}.${ext}`;
  link.click();
  URL.revokeObjectURL(url);
}

function closeSub() {

// 把二级面板浮到触发行的右边。位置相对 .plus-wrap / .mdl-wrap 算(它们是
// position:relative 且不滚动的那一层),所以不会被父菜单的 overflow 裁掉。
// 放不下就翻到左边;竖直方向夹回视口内;窄屏直接盖在父菜单原位上。
function placeSub(menuId, subId, rowEl) {
  const menu = el(menuId);
  const sub = el(subId);
  const wrap = menu.parentElement;
  const wr = wrap.getBoundingClientRect();
  const mr = menu.getBoundingClientRect();
  const rr = rowEl.getBoundingClientRect();

  sub.classList.remove('flip');
  // 先落一个位置,才能量到真实宽高(display:none 的元素量不出来)
  sub.style.left = Math.round(mr.right - wr.left + 6) + 'px';
  sub.style.top = Math.round(rr.top - wr.top) + 'px';
  const sr0 = sub.getBoundingClientRect();

  if (narrowMenus()) {
    // 盖在父菜单原位上:同一个左上角,同一个宽度
    sub.style.left = Math.round(mr.left - wr.left) + 'px';
    sub.style.top = Math.round(mr.top - wr.top) + 'px';
    sub.style.width = Math.round(mr.width) + 'px';
    return;
  }
  sub.style.width = '';

  // 右边放不下就翻到左边
  if (mr.right + 6 + sr0.width > window.innerWidth - 8) {
    sub.classList.add('flip');
    sub.style.left = Math.round(mr.left - wr.left - sr0.width - 6) + 'px';
  }
  // 竖直方向夹回视口
  const sr = sub.getBoundingClientRect();
  if (sr.bottom > window.innerHeight - 8) {
    sub.style.top = Math.round(rr.top - wr.top - (sr.bottom - (window.innerHeight - 8))) + 'px';
  } else if (sr.top < 8) {
    sub.style.top = Math.round(rr.top - wr.top + (8 - sr.top)) + 'px';
  }
}

function openSub(menuId, subId, rowEl, html) {
  closeSub();
  el(subId).innerHTML = html;
  el(subId).hidden = false;
  el(menuId).classList.add('has-sub');
  rowEl.classList.add('open');

}

// 点外面关掉。
//
// 【capture 阶段】不是随便选的:菜单项的 onclick 会用 innerHTML 重画菜单,
// 被点的那个按钮因此【从 DOM 上脱落】。如果这个监听跑在冒泡阶段,它拿到的

// 菜单外面",把刚打开的二级菜单立刻关掉。capture 在内联 onclick 之前跑,
// 那时 DOM 还是完整的。
document.addEventListener(

  (e) => {

// 由名称生成一个稳定的 id。中文名生成不出可读 id,就退回时间戳 —— id 只是主键,
// 界面上从不显示它。
function slugify(name) {
  const s = String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 24);
  return s || 'skill-' + Date.now().toString(36);
}
async function saveOwnSkill() {
  const name = el('skName').value.trim();
  const prompt = el('skPrompt').value.trim();
  const err = el('skErr');
  err.textContent = '';
  if (!name) { err.textContent = '给它起个名字'; return; }
  if (!prompt) { err.textContent = '提示词不能为空 —— 技能就是这段话'; return; }
  const r0 = await api('/chat/skills');
  const d0 = await r0.json();
  const mine = d0.mine || [];
  if (!EDIT_SKILL && mine.length >= (d0.max || 20)) { err.textContent = `自己的技能最多 ${d0.max} 个`; return; }
  let id = EDIT_SKILL;
  if (!id) {
    id = slugify(name);
    let n = 2;
    while (mine.some((k) => k.id === id)) id = slugify(name) + '-' + n++;
  }
  const next = EDIT_SKILL
    ? mine.map((k) => (k.id === EDIT_SKILL ? { ...k, name, desc: el('skDesc').value.trim(), prompt } : k))
    : [...mine, { id, name, desc: el('skDesc').value.trim(), prompt }];
  const r = await api('/chat/skills', { method: 'POST', body: JSON.stringify({ skills: next }) });
  const d = await r.json();

function pickFile() { el('file').click(); }
async function onFiles(files) {

function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(0) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}
async function addFile(file) {
  // 图片仍走原来那条路(image block + 缩略图预览)
  if (file.type.startsWith('image/')) return addImage(file);
  const cap = /pdf$/i.test(file.type) || /\.pdf$/i.test(file.name)
    ? (META && META.maxPdfBytes) || 20971520
    : (META && META.maxTextBytes) || 1048576;
  if (file.size > cap) { toast(`「${file.name}」超过 ${fmtBytes(cap)} 上限`, 'err'); return; }
  const data = await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(',')[1] || '');
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
  const r = await api('/chat/file', { method: 'POST', body: JSON.stringify({ data, mime: file.type, name: file.name }) });
  const d = await r.json();
  if (!r.ok || !d.ok) { toast(d.error || '上传失败', 'err'); return; }
  pendingFiles.push({ id: d.id, kind: d.kind, name: d.name, mime: d.mime, bytes: d.bytes });
  drawPending();
}
async function addImage(file) {
  if (!file.type.startsWith('image/')) { toast('只支持图片', 'err'); return; }
  if (META && file.size > META.maxImageBytes) { toast(`图片超过 ${Math.round(META.maxImageBytes / 1048576)}MB`, 'err'); return; }
  const data = await new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(',')[1] || '');
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
  const r = await api('/chat/image', { method: 'POST', body: JSON.stringify({ data, mime: file.type }) });
  const d = await r.json();
  if (!r.ok) { toast(d.error || '上传失败', 'err'); return; }
  pendingImgs.push({ id: d.id, mime: d.mime, url: URL.createObjectURL(file) });
  drawPending();
}
function drawPending() {
  const imgs = pendingImgs.map((p, i) =>
    `<div class="thumb"><img src="${p.url}" alt="待发送图片" /><button class="x" onclick="rmImage(${i})" aria-label="移除">✕</button></div>`).join('');
  const docs = pendingFiles.map((f, i) =>
    `<div class="doc">${svg(f.kind === 'pdf' ? ICO.file : ICO.file, '')}
      <span class="nm" title="${esc(f.name)}">${esc(f.name)}</span>
      <span class="sz">${fmtBytes(f.bytes || 0)}</span>
      <button class="x" onclick="rmFile(${i})" aria-label="移除">✕</button></div>`).join('');
  el('pending').innerHTML = imgs + docs;
}
function rmImage(i) { pendingImgs.splice(i, 1); drawPending(); }
function rmFile(i) { pendingFiles.splice(i, 1); drawPending(); }

// 管理员给该设备设了强制参数时,锁掉对应选择器并说明 —— 策略优先于偏好
function applyForced(d) {
  const note = [];
  // 管理员不被设备的强制模型锁住:那些 overrides 本来就是他自己配的,
  // 锁他只是让他绕路去改配置。普通用户仍然锁(策略优先于偏好)。
  const lockModel = !IS_ADMIN && !!(d && d.forcedModel);
  if (IS_ADMIN && d && d.forcedModel) {
    note.push(`该设备默认强制 ${d.forcedModel},管理员可自由切换`);
  }
  el('model').disabled = lockModel;
  if (lockModel) {
    if (![...el('model').options].some((o) => o.value === d.forcedModel)) {
      const o = document.createElement('option');
      o.value = d.forcedModel; o.textContent = d.forcedModel;
      el('model').appendChild(o);
    }
    el('model').value = d.forcedModel;
    note.push(`模型由管理员锁定为 ${d.forcedModel}`);
  }
  if (!IS_ADMIN && d && d.forcedThinking) { el('thinking').value = d.forcedThinking; el('thinking').disabled = true; note.push('思考模式已锁定'); }
  else el('thinking').disabled = false;
  if (!IS_ADMIN && d && d.forcedEffort) { el('effort').value = d.forcedEffort; el('effort').disabled = true; note.push('深度已锁定'); }
  else el('effort').disabled = false;
  el('lockNote').textContent = note.join(' · ');
}

// ── 发送 / 流式接收 ──
function setBusy(b) {
  // 一个圆键两种状态:空闲发送,生成中停止(cc-haha 也是这么换的)
  show('stopBtn', b);
  show('sendBtn', !b);
  el('sendBtn').disabled = b;
  if (b) { if (!statusTimer) statusTimer = setInterval(tickStatus, 1000); }
  else { clearInterval(statusTimer); statusTimer = null; }
}

// 「停止」是发给服务端的一条明确指令,不是把连接一关了事。
// 断开只代表"没人在看",服务端会在宽限期里继续把这一轮跑完(见 chat_runs.js)。
async function stopGen() {
  if (!curId) return;
  el('stopBtn').disabled = true;
  try { await api('/chat/stop', { method: 'POST', body: JSON.stringify({ sessionId: curId }) }); }
  catch {}
  el('stopBtn').disabled = false;
}
function regen() { send({ regenerate: true }); }

// 主动收掉当前这条流(切会话/新对话时用)。注意:它只断开订阅,
// 服务端那一轮照旧在跑 —— 回来还能接上。
function endStream() {
  if (cur && cur.ctl) { try { cur.ctl.abort(); } catch {} }
  cur = null;
  setBusy(false);
}

// 接回一个还在跑的回合
async function attach(fromSeq, announce) {
  if (!curId) return;
  const holder = messages[messages.length - 1];
  // 服务端还没落盘,本地也就没有占位 —— 补一条,内容由 snapshot 填
  if (!holder || holder.role !== 'assistant' || holder.done) {
    messages.push({ role: 'assistant', content: '', thinking: '', model: el('model').value, usage: {} });
  }
  if (announce) {
    el('resumed').textContent = '这条对话在服务端还在生成 —— 已经接回来了。关掉页面也不影响它跑完。';
    show('resumed', true);
    setTimeout(() => show('resumed', false), 8000);
  }
  const url = `${API}/chat/attach?sessionId=${encodeURIComponent(curId)}&from=${fromSeq || 0}&s=${encodeURIComponent(SESSION)}`;
  const ctl = new AbortController();
  cur = { ctl, startedAt: Date.now(), chars: 0, thinkingNow: false, retry: null, seq: fromSeq || 0 };
  setBusy(true);
  render();
  try {
    const r = await fetch(url, { signal: ctl.signal, headers: { authorization: 'Bearer ' + SESSION } });
    if (!r.ok) { endStream(); return; }
    await consume(r.body, messages[messages.length - 1]);
  } catch (err) {
    if (err.name !== 'AbortError') toast('续传中断: ' + err.message, 'err');
  } finally {
    // setBusy 无条件调用:它还负责关掉那个每秒刷新计时的 interval,
    // 放在 if (cur) 里的话,cur 已经被别处清空时定时器就留下来了
    cur = null;
    setBusy(false);
    render(); refreshArtifacts(); loadSessions();
  }
}

async function send(opts = {}) {
  const text = el('input').value.trim();
  if (!opts.regenerate && !text && !pendingImgs.length && !pendingFiles.length) return;
  if (cur) return;

  // 改写:先把这条及之后的都砍掉(服务端也砍),再当成一条新消息发出去
  const editing = editIndex;
  if (editing !== null && !opts.regenerate) {
    if (curId) {
      const r = await api('/chat/session/truncate', { method: 'POST', body: JSON.stringify({ id: curId, index: editing }) });
      if (!r.ok) { toast('改写失败:无法截断原对话', 'err'); return; }
    }
    messages = messages.slice(0, editing);
    editIndex = null;
    show('editingBar', false);
  }

  const imgs = pendingImgs.map((p) => ({ id: p.id, mime: p.mime }));
  const atts = pendingFiles.map((f) => ({ id: f.id, kind: f.kind, name: f.name }));
  if (!opts.regenerate) {
    messages.push({ role: 'user', content: text, images: imgs, files: atts, ts: Date.now() });
    el('input').value = ''; autoGrow();
    try { localStorage.removeItem(draftKey()); } catch {}
    pendingImgs = []; pendingFiles = []; drawPending();
  } else {
    while (messages.length && messages[messages.length - 1].role === 'assistant') messages.pop();
  }

  // 占位的 assistant 消息:边收边填
  const holder = { role: 'assistant', content: '', thinking: '', model: el('model').value, usage: {},
    mode: MODE || undefined, queries: [], sources: [], citations: [] };
  messages.push(holder);
  const ctl = new AbortController();
  cur = { ctl, startedAt: Date.now(), chars: 0, thinkingNow: false, retry: null, seq: 0 };
  setBusy(true);
  scrollDown(true);
  render();

  try {
    const r = await fetch(API + '/chat/stream', {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: 'Bearer ' + SESSION },
      body: JSON.stringify({
        sessionId: curId,
        text: opts.regenerate ? '' : text,
        images: opts.regenerate ? [] : imgs,
        files: opts.regenerate ? [] : atts,
        mode: MODE,
        skills: PICKED_SKILLS,
        model: el('model').value,
        thinking: el('thinking').value,
        effort: el('effort').value,
        deviceId: el('device').value,
        regenerate: !!opts.regenerate,
      }),
      signal: ctl.signal,
    });
    if (r.status === 401) { toLogin(); return; }
    // 这个会话已经在生成了(另一个标签页 / 上次没关的连接):接回去,别开第二条
    if (r.status === 409) {
      const d = await r.json().catch(() => ({}));
      messages.pop();
      cur = null; setBusy(false);
      if (d.live) { curId = d.sessionId || curId; return attach(d.live.seq, true); }
      toast(d.error || '这个对话正在生成中', 'err');
      render();
      return;
    }
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      holder.error = d.error || `HTTP ${r.status}`;
      cur = null; setBusy(false);
      render();
      return;
    }
    await consume(r.body, holder);
  } catch (err) {
    if (err.name === 'AbortError') {
      // 我们主动断开的(切会话):服务端那轮还在跑,不要在消息上写"已停止"
      return;
    }
    holder.error = '网络中断: ' + err.message;
  } finally {
    cur = null;
    setBusy(false);
    render();
    refreshArtifacts();
    loadSessions();
    loadUsage(); // 刚烧掉的额度立刻反映到侧栏那条(账户口径吃服务端缓存,不会打上游)
  }
}

// 消费一条 SSE:事件很少但每种都有意义,集中在这里翻译成界面动作
async function consume(body, holder) {
  // 取最后一条 assistant 消息的节点。
  // 【不能】用 `.msg.assistant:last-of-type`:CSS 的 :last-of-type 看的是"同类元素
  // (div)里的最后一个",与 class 无关。生成中状态行也是一个 div 且排在消息后面,
  // 于是没有任何 .msg.assistant 满足 :last-of-type —— 两个选择器全返回 null,
  // 增量渲染静默失效,正文要等流结束后整页重渲染才出现(等于没有流式效果)。
  const lastAssistant = () => {
    const all = el('msgs').querySelectorAll('.msg.assistant');
    return all.length ? all[all.length - 1] : null;
  };
  const bodyEl = () => {
    const m = lastAssistant();
    return m ? m.querySelector('.body') : null;
  };
  const thinkNode = () => {
    const m = lastAssistant();
    return m ? m.querySelector('.think') : null;
  };
  const reader = body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  let sawAnything = false;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf('\n\n')) >= 0) {
      const chunk = buf.slice(0, nl);
      buf = buf.slice(nl + 2);
      const line = chunk.split('\n').find((l) => l.startsWith('data:'));
      if (!line) continue;
      let ev;
      try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
      if (cur && typeof ev.n === 'number') cur.seq = ev.n;

      if (ev.t === 'start') {
        curId = ev.sessionId;
        history.replaceState({}, '', CHAT_PATH + '?c=' + encodeURIComponent(curId));
      } else if (ev.t === 'snapshot') {
        // 续传:一次性把已经生成的部分补齐(那一段没有逐字动画,内容不缺)
        holder.content = ev.text || '';
        holder.thinking = ev.thinking || '';
        holder.usage = ev.usage || {};
        holder.model = ev.model || holder.model;
        if (ev.queries) holder.queries = ev.queries;
        if (ev.sources) holder.sources = ev.sources;
        if (cur) { cur.chars = holder.content.length; cur.startedAt = ev.startedAt || cur.startedAt; }
        sawAnything = !!(holder.content || holder.thinking);
        render();
      } else if (ev.t === 'delta') {
        holder.content += ev.v;
        sawAnything = true;
        if (cur) { cur.chars = holder.content.length; cur.thinkingNow = false; }
        // 流式期间只更新这一条的正文,不整页重渲染(否则会闪且丢滚动位置)
        const b = bodyEl();
        if (b) { b.innerHTML = renderMarkdown(holder.content); b.classList.add('typing'); }
        scrollDown();
      } else if (ev.t === 'thinking') {
        holder.thinking += ev.v;
        sawAnything = true;
        if (cur) cur.thinkingNow = true;
        let node = thinkNode();
        if (!node) { render(); node = thinkNode(); }
        if (node) {
          node.querySelector('.tbody').textContent = holder.thinking;
          const tail = node.querySelector('.tail');
          if (tail) tail.textContent = thinkTail(holder.thinking, true);
          const lbl = node.querySelector('.lbl');
          if (lbl && !lbl.dataset.live) { lbl.dataset.live = '1'; lbl.innerHTML = '思考中<span class="dots"></span>'; }
          if (node.open) node.querySelector('.tbody').scrollTop = node.querySelector('.tbody').scrollHeight;
        }
        scrollDown();
      } else if (ev.t === 'tool_start') {
        // 模型开始用服务端工具了。查询词随后由 tool_query 补上
        if (cur) cur.searching = ev.name === 'web_fetch' ? '抓取网页' : '联网检索';
        render();
      } else if (ev.t === 'tool_query') {
        holder.queries = holder.queries || [];
        holder.queries.push(ev.query);
        render();
      } else if (ev.t === 'tool_result') {
        if (ev.kind === 'error') {
          toast('联网检索失败: ' + ev.error, 'err');
        } else {
          holder.sources = (holder.sources || []).concat(ev.results || []);
        }
        if (cur) cur.searching = '';
        render();
      } else if (ev.t === 'citation') {
        holder.citations = holder.citations || [];
        if (!holder.citations.some((c) => c.url === ev.url)) holder.citations.push({ title: ev.title, url: ev.url });
      } else if (ev.t === 'continuing') {
        // pause_turn 续轮:说一声,否则界面上看着像卡住了
        if (cur) cur.searching = `继续第 ${ev.round} 轮`;
        render();
      } else if (ev.t === 'retry') {
        if (cur) cur.retry = { attempt: ev.attempt, max: ev.max, status: ev.status, message: ev.message };
        render();
        // 退避结束后状态行自己会换回来(下一个事件触发 render)
        setTimeout(() => { if (cur && cur.retry) { cur.retry = null; render(); } }, (ev.delayMs || 800) + 200);
      } else if (ev.t === 'usage') {
        holder.usage = { input: ev.input, output: ev.output, cacheRead: ev.cacheRead, cacheWrite: ev.cacheWrite };
      } else if (ev.t === 'error') {
        holder.error = ev.message;
      } else if (ev.t === 'title') {
        // 标题是 AI 生成的,晚一两秒到 —— 到了就刷一下列表
        loadSessions();
      } else if (ev.t === 'gone') {
        // 回合已经结束并落盘了:重新读一次会话最省事,也最不会错
        if (curId) reloadCurrent();
        return;
      } else if (ev.t === 'done') {
        holder.done = true;
        holder.stopped = ev.stopped;
        holder.disconnected = ev.disconnected;
        holder.ms = ev.ms;
        if (ev.context) drawContext(ev.context);
      }
    }
  }
  if (!sawAnything && !holder.error) holder.error = '没有收到内容';
}

async function reloadCurrent() {
  const r = await api('/chat/session?id=' + encodeURIComponent(curId));
  if (!r.ok) return;
  const d = await r.json();
  messages = d.session.messages || [];
  drawContext(d.context);
  render(); refreshArtifacts();
}

// ── 启动 ──
async function boot() {
  applyTheme(savedTheme());
  applyPlaceholder();
  el('sendMode').value = PREF.sendMode;
  el('prefThink').checked = !!PREF.openThink;
  if (IS_ADMIN) el('loginHint').textContent = '用管理员账号登录';
  if (!SESSION) { toLogin(); return; }
  try {
    // 管理员侧没有 /me(那是用户端的),用固定身份
    ME = IS_ADMIN ? { user: { name: 'admin' } } : await (await api('/me')).json();
  } catch { return; }
  show('loginView', false); show('app', true);
  el('whoName').textContent = ME.user.name + (IS_ADMIN ? '(管理员)' : '');
  el('homeLink').href = HOME;
  el('homeLink').textContent = IS_ADMIN ? '返回管理台' : '我的设备';
  if (ME.announcement) drawNotice(ME.announcement);
  else {
    try { drawNotice((await (await api('/announcement')).json()).announcement); } catch {}
  }

  META = await (await api('/chat/meta')).json();
  const models = META.models || [];
  // 按档位分组:一长串扁平的 id 里挑模型,得先在心里给它们分类
  const tiers = [...new Set(models.map((m) => m.tier || '其它'))];
  el('model').innerHTML = tiers
    .map((t) => {
      const opts = models
        .filter((m) => (m.tier || '其它') === t)
        .map((m) => `<option value="${esc(m.id)}">${esc(m.id)}${m.latest ? ' ·最新' : ''}</option>`)
        .join('');
      return `<optgroup label="${esc(t)}">${opts}</optgroup>`;
    })
    .join('');
  let want = null;
  try { want = localStorage.getItem('cc-chat-model'); } catch {}
  if (want && models.some((m) => m.id === want)) el('model').value = want;
  else {
    // 默认挑一个"最新"的中高端模型,别让用户第一件事就是选模型
    const pref = models.find((m) => m.latest && /opus|sonnet/i.test(m.id)) || models.find((m) => m.latest) || models[0];
    if (pref) el('model').value = pref.id;
  }
  try {
    const th = localStorage.getItem('cc-chat-thinking');
    const ef = localStorage.getItem('cc-chat-effort');
    if (th) el('thinking').value = th;
    if (ef) el('effort').value = ef;
  } catch {}
  onModelChange(true);

  drawModelBtn();
  drawModeChips();
  // 服务端没配技能时,已选的技能 id 要清掉,否则徽标会指向不存在的东西
  const known = new Set((META.skills || []).map((k) => k.id));
  if (PICKED_SKILLS.some((id) => !known.has(id))) {
    PICKED_SKILLS = PICKED_SKILLS.filter((id) => known.has(id));
    try { localStorage.setItem('cc-chat-skills', JSON.stringify(PICKED_SKILLS)); } catch {}
    drawModeChips();
  }

  const graceMin = Math.round((META.disconnectGraceMs || 0) / 60000);
  el('graceNote').textContent = META.disconnectGraceMs
    ? `断线保活:关掉页面或断网后,服务端会把这一轮继续跑完,${graceMin >= 1 ? graceMin + ' 分钟' : Math.round(META.disconnectGraceMs / 1000) + ' 秒'}内回来还能接上。点「停止」才是真的取消。`
    : '断线保活未开启:连接一断就取消生成(config.json 里 chatDisconnectGraceMs 可开)。';

  const devs = META.devices || [];
  el('device').innerHTML = devs.map((d) => `<option value="${esc(d.id)}">${esc(d.name)}</option>`).join('');
  show('device', devs.length > 1); // 只有一台设备时没什么可选的,不占位置
  if (!devs.length) {
    el('hint').textContent = '还没有分配设备 —— 请让管理员在管理台「用户」页给你分配一个客户端令牌';
    el('sendBtn').disabled = true;
  } else {
    let wd = null;
    try { wd = localStorage.getItem('cc-chat-device'); } catch {}
    if (wd && devs.some((d) => d.id === wd)) el('device').value = wd;
    applyForced(devs.find((d) => d.id === el('device').value));
    if (!META.persisted) el('hint').textContent = '未启用数据目录,会话不会保存';
  }

  await loadSessions();
  loadUsage(); // 不 await:拿不到用量不该挡住聊天页可用
  const c = new URL(location.href).searchParams.get('c');
  if (c) await openChat(c);
  else { restoreDraft(); render(); }
  el('input').focus();
}
boot();
</script>
