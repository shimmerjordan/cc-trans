<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cc-trans · 聊天</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%234f46e5'/%3E%3Ctext x='8' y='12' font-size='10' fill='white' text-anchor='middle' font-family='monospace'%3Ec%3C/text%3E%3C/svg%3E" />
<style>
  /*__TOKENS__*/

  /* ─────────────────────────────────────────────────────────────────
     聊天页外观 = cc-haha 的「纸 · 墨 · 印」。
     底是暖纸、主色是赤陶印 #96442B、标题走衬线;侧栏是【浅色】不是深色,
     用户消息是【整块浅底卡】不是右侧小气泡,输入框是【带圆形发送键的大圆角卡】。
     所有颜色一律走 --color-*(语义层,见 haha-tokens.css),页面里不写死色值 ——
     六套主题就是靠这一点一次性全对。
     ───────────────────────────────────────────────────────────────── */

  * { box-sizing: border-box; }
  /* 必须在所有 display 规则之前:给元素设了 display:grid/flex 会【覆盖】浏览器
     默认的 [hidden]{display:none},于是 hidden 的容器照样参与布局。
     这曾让登录容器和 Artifacts 面板同时挤在页面里。 */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 400 var(--fs-body)/var(--lh-relaxed) var(--font-body);
    background: var(--color-background); color: var(--color-text-primary);
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  :focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; border-radius: var(--radius-sm); }
  :focus:not(:focus-visible) { outline: none; }

  button {
    font: inherit; cursor: pointer;
    border: 1px solid var(--color-border); background: var(--color-surface);
    color: var(--color-text-primary); border-radius: var(--radius-md);
    padding: 6px var(--s3); min-height: 32px;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 150ms var(--motion-easing), border-color 150ms var(--motion-easing), color 150ms var(--motion-easing);
  }
  button:hover:not(:disabled) { background: var(--color-surface-hover); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--color-brand); color: var(--color-on-primary); border-color: var(--color-brand); font-weight: 550; }
  button.primary:hover:not(:disabled) { background: var(--color-brand-hover); border-color: var(--color-brand-hover); }
  button.ghost { background: none; border-color: transparent; color: var(--color-text-secondary); }
  button.ghost:hover:not(:disabled) { background: var(--color-surface-hover); color: var(--color-text-primary); }
  button.sm { min-height: 26px; padding: 2px var(--s2); font-size: var(--fs-note); }
  button.icon { padding: 6px; min-width: 32px; justify-content: center; }
  button.icon svg { width: 16px; height: 16px; }
  button.danger { color: var(--color-error); border-color: color-mix(in srgb, var(--color-error) 35%, var(--color-border)); }

  select, input, textarea {
    font: inherit; font-size: var(--fs-note); color: var(--color-text-primary);
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius-md); padding: 5px var(--s2); min-height: 30px; max-width: 100%;
  }
  select { appearance: none; padding-right: 22px; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: right 10px center, right 5px center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  select:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: none; border-color: var(--color-border-focus);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-brand) 18%, transparent);
  }
  select:disabled { opacity: .6; cursor: not-allowed; background: var(--color-surface-variant); }

  dialog {
    border: 1px solid var(--color-border); border-radius: var(--radius-3xl);
    background: var(--color-surface); color: var(--color-text-primary);
    padding: var(--s6); box-shadow: var(--shadow-overlay);
    max-width: min(460px, calc(100vw - var(--s6)));
  }
  dialog::backdrop { background: rgba(var(--cc-scrim-rgb), .42); }
  dialog h3 { margin: 0 0 var(--s3); font-size: 17px; font-family: var(--font-headline); font-weight: 600; }
  dialog p { margin: 0 0 var(--s4); color: var(--color-text-secondary); font-size: var(--fs-note); }
  dialog input[type=text] { width: 100%; min-height: 38px; font-size: var(--fs-body); }
  .dlg-acts { display: flex; gap: var(--s2); justify-content: flex-end; margin-top: var(--s5); }

  /* ── 骨架 ──
     grid-template-rows: minmax(0,1fr) + 子项 min-height:0 是必须的:
     默认 auto 行高会被"消息流"的内容撑到远超视口,结果输入框被挤出屏幕。 */
  .app {
    display: grid; grid-template-columns: var(--sidebar-width) 1fr;
    grid-template-rows: minmax(0, 1fr); height: 100dvh; overflow: hidden;
    background: var(--color-background);
  }
  .app > * { min-height: 0; }
  .app.with-panel { grid-template-columns: var(--sidebar-width) 1fr minmax(360px, 38%); }
  .app.rail { grid-template-columns: 0 1fr; }
  .app.rail.with-panel { grid-template-columns: 0 1fr minmax(360px, 38%); }

  /* ── 左栏 ──
     cc-haha 的侧栏是【浅色】的,和正文同一族纸底,只靠一条发丝线分开。
     原来那版是深色导航条 —— 那是 cc-trans 自己的观感,不是这套。 */
  aside {
    background: var(--color-surface-sidebar); color: var(--color-text-primary);
    display: flex; flex-direction: column; min-width: 0; overflow: hidden;
    border-right: 1px solid var(--color-border);
  }
  aside .top { padding: var(--s5) var(--s5) var(--s3); display: flex; gap: var(--s2); align-items: center; }
  /* 字标走衬线,后半截是赤陶 —— cc-haha 的 "cc-haha" 就是这么排的 */
  .brand {
    flex: 1; min-width: 0; font-family: var(--font-headline); font-size: 19px;
    font-weight: 600; letter-spacing: .01em; white-space: nowrap; color: var(--color-text-primary);
  }
  .brand em { font-style: normal; color: var(--color-brand); }
  aside .top button { border-color: transparent; background: none; color: var(--color-text-tertiary); }
  aside .top button:hover { background: var(--color-surface-hover); color: var(--color-text-primary); }

  .new-chat { padding: 0 var(--s4) var(--s3); }
  .new-chat button {
    width: 100%; justify-content: flex-start; gap: var(--s3);
    min-height: 40px; padding: 0 var(--s4); font-size: var(--fs-body); font-weight: 500;
    background: none; border-color: transparent; color: var(--color-text-primary);
    border-radius: var(--radius-lg);
  }
  .new-chat button:hover { background: var(--color-surface-hover); }
  .new-chat button svg { width: 18px; height: 18px; color: var(--color-text-secondary); }

  .find { padding: 0 var(--s4) var(--s4); position: relative; }
  .find input {
    width: 100%; background: var(--color-surface); border-color: var(--color-border);
    color: var(--color-text-primary); padding-left: 32px; min-height: 36px;
    font-size: var(--fs-note); border-radius: var(--radius-lg);
  }
  .find input::placeholder { color: var(--color-text-tertiary); }
  .find > svg { position: absolute; left: calc(var(--s4) + 10px); top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--color-text-tertiary); pointer-events: none; }
  .find kbd {
    position: absolute; right: calc(var(--s4) + 8px); top: 50%; transform: translateY(-50%);
    font: 400 10px/1 var(--font-mono); color: var(--color-text-tertiary);
    border: 1px solid var(--color-border); border-radius: 4px; padding: 3px 5px; pointer-events: none;
  }

  .sessions { flex: 1; overflow-y: auto; padding: 0 var(--s3) var(--s4); }
  .grp {
    font-size: var(--fs-stamp); color: var(--color-text-tertiary);
    padding: var(--s4) var(--s3) var(--s1); letter-spacing: .04em; font-weight: 500;
  }
  /* 选中的会话是一张【浮起来的白卡】(描边 + 微阴影),不是一块高亮底 */
  .sess {
    display: flex; align-items: flex-start; gap: var(--s2);
    padding: 9px var(--s3); border-radius: var(--radius-lg); cursor: pointer;
    color: var(--color-text-secondary); font-size: var(--fs-note);
    border: 1px solid transparent; position: relative;
  }
  .sess:hover { background: var(--color-surface-hover); color: var(--color-text-primary); }
  .sess.active {
    background: var(--color-surface); border-color: var(--color-border);
    color: var(--color-text-primary); box-shadow: var(--shadow-card);
  }
  .sess .txt { flex: 1; min-width: 0; }
  .sess .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 450; }
  .sess.active .t { font-weight: 550; }
  .sess .p { display: block; font-size: var(--fs-stamp); color: var(--color-text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .sess .acts { display: none; gap: 1px; flex: none; padding-top: 1px; }
  .sess:hover .acts, .sess.active .acts, .sess:focus-within .acts { display: flex; }
  .sess .acts button { padding: 2px 5px; min-height: 0; font-size: var(--fs-stamp); background: none; border: 0; color: var(--color-text-tertiary); border-radius: var(--radius-sm); }
  .sess .acts button:hover { color: var(--color-text-primary); background: var(--color-surface-hover); }
  .sess .pin { flex: none; color: var(--color-brand); font-size: 10px; padding-top: 4px; }
  /* 正在生成:断线保活之后"另一个标签页里那条还在跑"是常态,列表是唯一能发现它的地方 */
  .sess .dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--color-brand); margin: 7px 0 0; animation: pulse 1.4s var(--motion-easing) infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .sess-empty { padding: var(--s4) var(--s3); font-size: var(--fs-note); color: var(--color-text-tertiary); }

  aside .foot {
    padding: var(--s3) var(--s4) var(--s4); border-top: 1px solid var(--color-border);
    display: flex; flex-direction: column; gap: var(--s2); min-width: 0;
    font-size: var(--fs-note); color: var(--color-text-tertiary);
  }
  aside .foot .me { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  aside .foot .me b { color: var(--color-text-primary); font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside .foot .me span { flex: none; font-size: var(--fs-stamp); }
  aside .foot .me span.near-cap { color: var(--color-warning); }
  aside .foot .acts { display: flex; gap: var(--s2); align-items: center; }
  aside .foot .acts a, aside .foot .acts button {
    flex: 1; justify-content: center; text-align: center; text-decoration: none;
    font-size: var(--fs-stamp); padding: 5px var(--s2); min-height: 30px;
    border-radius: var(--radius-md); border: 1px solid var(--color-border);
    background: var(--color-surface); color: var(--color-text-secondary);
    display: inline-flex; align-items: center;
  }
  aside .foot .acts a:hover, aside .foot .acts button:hover { background: var(--color-surface-hover); color: var(--color-text-primary); }

  /* 用量条:侧栏底部常驻一行。为什么摆在这儿而不是塞进偏好设置 ——
     "我还能不能再发一句"是随时要看一眼的信息,不是设置项。点开看全部。 */
  aside .foot .usage-strip {
    display: flex; align-items: center; gap: var(--s2); width: 100%;
    padding: 6px var(--s2); border-radius: var(--radius-md);
    border: 1px solid var(--color-border); background: var(--color-surface);
    color: var(--color-text-secondary); font-size: var(--fs-stamp); text-align: left;
  }
  aside .foot .usage-strip:hover { background: var(--color-surface-hover); color: var(--color-text-primary); }
  aside .foot .usage-strip .ut { flex: none; }
  aside .foot .usage-strip .track { flex: 1; height: 4px; border-radius: 999px; background: var(--color-border); overflow: hidden; min-width: 24px; }
  aside .foot .usage-strip .track i { display: block; height: 100%; background: var(--color-brand); border-radius: 999px; transition: width var(--motion-fast) var(--motion-easing); }
  aside .foot .usage-strip .track i.warn { background: var(--color-warning); }
  aside .foot .usage-strip .track i.err { background: var(--color-error); }
  aside .foot .usage-strip .up { flex: none; font-variant-numeric: tabular-nums; }
  aside .foot .usage-strip .up.warn { color: var(--color-warning); }
  aside .foot .usage-strip .up.err { color: var(--color-error); }

  /* 用量弹窗里的条目 */
  .ubar { margin-bottom: var(--s3); }
  .ubar .r1 { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); font-size: var(--fs-note); margin-bottom: 4px; }
  .ubar .r1 b { font-weight: 550; color: var(--color-text-primary); }
  .ubar .r1 .p { font-variant-numeric: tabular-nums; color: var(--color-text-secondary); }
  .ubar .r1 .p.warn { color: var(--color-warning); }
  .ubar .r1 .p.err { color: var(--color-error); }
  .ubar .tr { height: 6px; border-radius: 999px; background: var(--color-border); overflow: hidden; }
  .ubar .tr i { display: block; height: 100%; background: var(--color-brand); border-radius: 999px; }
  .ubar .tr i.warn { background: var(--color-warning); }
  .ubar .tr i.err { background: var(--color-error); }
  .ubar .sub { font-size: var(--fs-stamp); color: var(--color-text-tertiary); margin-top: 3px; }
  .u-head { font-size: var(--fs-note); font-weight: 550; color: var(--color-text-primary); margin: var(--s4) 0 var(--s2); }
  .u-head:first-child { margin-top: 0; }
  .u-nums { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); font-size: var(--fs-note); color: var(--color-text-secondary); margin-bottom: var(--s2); }
  .u-nums b { color: var(--color-text-primary); font-weight: 550; font-variant-numeric: tabular-nums; }
  .u-alert {
    border: 1px solid var(--color-error); border-radius: var(--radius-md);
    padding: var(--s3); margin-bottom: var(--s3); font-size: var(--fs-note);
  }
  .u-alert b { color: var(--color-error); }

  /* ── 中栏 ── */
  main { display: flex; flex-direction: column; min-width: 0; background: var(--color-background); position: relative; }

  /* 会话抬头:衬线大标题 + 一行元信息(条数 · 最后更新 · 模型)。
     这是 cc-haha 每个会话最上面那块。原来那版顶栏塞满了选择器 ——
     那些控件在这套设计里属于输入框,不属于抬头。 */
  .chat-head {
    padding: var(--s5) var(--s7) var(--s4);
    border-bottom: 1px solid var(--color-border);
    display: flex; align-items: flex-start; gap: var(--s3);
    background: var(--color-background);
  }
  .chat-head .htxt { flex: 1; min-width: 0; }
  .chat-title {
    margin: 0; font-family: var(--font-headline); font-size: var(--fs-title);
    font-weight: 600; line-height: 1.3; letter-spacing: -.01em;
    color: var(--color-text-primary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .chat-meta {
    margin-top: 3px; font-size: var(--fs-note); color: var(--color-text-tertiary);
    display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap;
  }
  .chat-meta .sep { opacity: .5; }
  .chat-meta .liveflag { color: var(--color-success); display: inline-flex; align-items: center; gap: 5px; }
  .chat-meta .liveflag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.4s var(--motion-easing) infinite; }
  .chat-head .hacts { display: flex; gap: var(--s1); flex: none; }
  .chat-head .hacts button { border-color: transparent; background: none; color: var(--color-text-tertiary); }
  .chat-head .hacts button:hover { background: var(--color-surface-hover); color: var(--color-text-primary); }

  /* 公告条 */
  .notice {
    display: flex; gap: var(--s3); align-items: flex-start;
    padding: var(--s3) var(--s7); font-size: var(--fs-note);
    background: var(--color-info-container); color: var(--color-on-info-container);
    border-bottom: 1px solid var(--color-border);
  }
  .notice.warn { background: var(--color-warning-container); color: var(--color-on-warning-container); }
  .notice.err { background: var(--color-error-container); color: var(--color-on-error-container); }
  .notice .nt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .notice button { background: none; border: 0; color: inherit; opacity: .65; min-height: 22px; padding: 0 4px; }
  .notice button:hover { opacity: 1; background: none; }

  .resumed {
    padding: var(--s3) var(--s7); font-size: var(--fs-note);
    color: var(--color-on-success-container); background: var(--color-success-container);
    border-bottom: 1px solid var(--color-border);
  }

  .stream-wrap { flex: 1; min-height: 0; position: relative; display: flex; }
  .stream { flex: 1; min-height: 0; overflow-y: auto; overflow-anchor: none; }
  /* 正文栏宽度。cc-haha 的对话列比 cc-trans 原来那版宽、留白也更大 */
  .stream-inner { max-width: 800px; margin: 0 auto; padding: var(--s7) var(--s7) var(--s6); }

  /* ── 回合导航(左侧细条)── */
  .nav-lane {
    position: absolute; left: 0; top: 0; bottom: 0; width: 22px; z-index: var(--z-sticky);
    display: flex; flex-direction: column; justify-content: center; gap: 2px;
    padding: var(--s4) 0; pointer-events: none;
  }
  .nav-lane.on { pointer-events: auto; }
  .nav-lane button { border: 0; background: none; padding: 0 0 0 5px; min-height: 0; height: 10px; display: flex; align-items: center; cursor: pointer; flex: none; }
  /* 宽度【不】做过渡:它是每次 pointermove 直接算出来的,加了过渡反而追不上指针 */
  .nav-lane button i { display: block; height: 2px; border-radius: 2px; background: var(--color-outline); transition: background 150ms var(--motion-easing); }
  .nav-lane button:hover i, .nav-lane button:focus-visible i, .nav-lane button.on i { background: var(--color-brand); }
  .nav-tip {
    position: fixed; z-index: var(--z-toast); max-width: 320px;
    background: var(--color-surface); color: var(--color-text-primary);
    border: 1px solid var(--color-border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-overlay); padding: var(--s2) var(--s3);
    font-size: var(--fs-note); line-height: 1.5; pointer-events: none;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }

  .to-latest {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: var(--s4); z-index: var(--z-sticky);
    background: var(--color-surface); border: 1px solid var(--color-border); box-shadow: var(--shadow-card);
    border-radius: var(--radius-full); font-size: var(--fs-note); padding: 6px var(--s4); color: var(--color-text-secondary);
  }

  /* ── 消息 ──
     用户消息:整块浅底卡(--color-surface-user-msg),radius-lg,18/13 内边距。
     不是右侧的小气泡 —— cc-haha 里它占满正文栏。 */
  .msg { margin-bottom: var(--s6); }
  .msg.user { display: flex; justify-content: flex-end; }
  /* 宽度上限逐条对齐 cc-haha 的 max-w-[82%] / sm:78% / lg:640px:
     用户消息是右对齐、随内容收缩的卡,不是撑满整列 */
  .msg.user .col { max-width: 82%; min-width: 0; display: flex; flex-direction: column; align-items: flex-end; gap: var(--s2); }
  @media (min-width: 640px)  { .msg.user .col { max-width: 78%; } }
  @media (min-width: 1024px) { .msg.user .col { max-width: 640px; } }
  .msg.user .bubble {
    background: var(--color-surface-user-msg); border-radius: var(--radius-lg);
    padding: 13px 18px; font-size: var(--fs-body); line-height: var(--lh-relaxed);
    color: var(--color-text-primary); overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .msg.assistant .who { font-size: var(--fs-stamp); color: var(--color-text-tertiary); margin-bottom: var(--s2); display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
  .msg.assistant .body { overflow-wrap: anywhere; font-size: var(--fs-body); line-height: var(--lh-relaxed); }
  .msg .imgs { display: flex; gap: var(--s2); flex-wrap: wrap; margin-bottom: var(--s2); }
  .msg .imgs img { max-height: 160px; border-radius: var(--radius-md); border: 1px solid var(--color-border); cursor: zoom-in; }
  .msg .err {
    color: var(--color-on-error-container); font-size: var(--fs-note);
    background: var(--color-error-container); border: 1px solid color-mix(in srgb, var(--color-error) 28%, transparent);
    border-radius: var(--radius-md); padding: var(--s2) var(--s3); margin-top: var(--s3);
  }

  /* 消息操作条:悬停才出现,占位固定 —— 出现时不推动版面 */
  .acts-row { height: 26px; display: flex; align-items: center; gap: 1px; margin-top: var(--s2); opacity: 0; transition: opacity 150ms var(--motion-easing); }
  .msg.user .acts-row { justify-content: flex-end; }
  .msg:hover .acts-row, .msg:focus-within .acts-row { opacity: 1; }
  .acts-row button {
    min-height: 24px; padding: 2px 8px; font-size: var(--fs-stamp); border: 0; background: none;
    color: var(--color-text-tertiary); border-radius: var(--radius-full);
  }
  .acts-row button:hover { background: var(--color-surface-hover); color: var(--color-text-primary); }
  .acts-row .stamp { font-size: var(--fs-stamp); color: var(--color-text-tertiary); font-variant-numeric: tabular-nums; padding: 0 var(--s2); white-space: nowrap; }
  .msg.last .acts-row { opacity: 1; }

  /* 思考过程:一行折叠 + 尾巴预览 */
  .think { margin-bottom: var(--s3); }
  .think > summary {
    cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: var(--s2);
    font-size: var(--fs-note); color: var(--color-text-tertiary); padding: 4px var(--s2); margin: 0 calc(var(--s2) * -1);
    border-radius: var(--radius-md);
  }
  .think > summary:hover { background: var(--color-surface-hover); }
  .think > summary::-webkit-details-marker { display: none; }
  .think > summary .lbl { flex: none; font-style: italic; }
  .think > summary .tail { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-style: italic; }
  .think > summary .caret { flex: none; font-size: 8px; }
  .think[open] > summary .tail { display: none; }
  .think .tbody {
    margin-top: var(--s1); padding: var(--s3) var(--s4); font-size: var(--fs-code); color: var(--color-text-secondary);
    white-space: pre-wrap; max-height: 300px; overflow-y: auto; line-height: 1.7;
    background: var(--color-surface-container-lowest); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  }
  .dots::after { content: ''; animation: dots 1.4s steps(1, end) infinite; }
  @keyframes dots { 0%,20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%,100% { content: '...'; } }

  .typing::after {
    content: ""; display: inline-block; width: 2px; height: 1em; margin-left: 2px;
    background: var(--color-text-tertiary); vertical-align: middle; animation: caret 1s steps(2) infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }

  /* 生成中的状态行:动词 + 已用时 + 已出 token */
  .turn-status { display: flex; align-items: center; gap: 9px; font-size: var(--fs-status); color: var(--color-text-secondary); padding: 2px 0 var(--s5); }
  .turn-status .spark { color: var(--color-brand); animation: pulse 1.4s var(--motion-easing) infinite; }
  .turn-status b { color: var(--color-text-primary); font-weight: 550; }
  .turn-status .num { font-family: var(--font-mono); font-size: var(--fs-note); font-variant-numeric: tabular-nums; }
  .retry-bar {
    display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; margin-bottom: var(--s4);
    font-size: var(--fs-note); color: var(--color-on-warning-container);
    background: var(--color-warning-container); border: 1px solid color-mix(in srgb, var(--color-warning) 30%, transparent);
    border-radius: var(--radius-lg); padding: var(--s2) var(--s4);
  }
  .retry-bar .tag { font-family: var(--font-mono); font-size: var(--fs-stamp); border: 1px solid color-mix(in srgb, var(--color-warning) 34%, transparent); border-radius: 4px; padding: 1px 5px; }

  /* ── Markdown ──
     字号/间距逐条对齐 cc-haha 的 prose 设置(标题走衬线是这套的签名)。 */
  .body h1, .body h2, .body h3, .body h4 {
    font-family: var(--font-headline); font-weight: 600;
    color: var(--color-text-primary); letter-spacing: -.01em; line-height: 1.35;
  }
  .body h1 { font-size: 22px; margin: var(--s6) 0 var(--s4); }
  .body h2 { font-size: 19px; margin: var(--s7) 0 var(--s3); padding-bottom: var(--s2); border-bottom: 1px solid var(--color-border); }
  .body h3 { font-size: 16px; margin: var(--s6) 0 var(--s2); }
  .body h4 { font-size: var(--fs-body); margin: var(--s5) 0 var(--s2); }
  .body p { margin: var(--s2) 0; line-height: var(--lh-relaxed); }
  .body ul, .body ol { margin: var(--s2) 0; padding-left: 20px; }
  .body li { margin: 2px 0; }
  .body li::marker { color: var(--color-text-tertiary); }
  .body li > ul, .body li > ol { margin: 2px 0; }
  .body blockquote {
    margin: var(--s4) 0; padding: var(--s2) var(--s4); font-style: italic;
    border-left: 4px solid var(--cc-ac-border); background: var(--color-surface-container-low);
    border-radius: 0 var(--radius-md) var(--radius-md) 0; color: var(--color-text-secondary);
  }
  /* 行内码是这套设计的签名:暖底小卡片 + 发丝描边 */
  .body code, .bubble code {
    font-family: var(--font-mono); font-size: var(--fs-code); color: var(--color-code-fg);
    background: var(--color-code-bg); border: 1px solid var(--color-border);
    border-radius: var(--radius-sm); padding: 2px 6px;
  }
  .body hr { border: 0; border-top: 1px solid var(--color-border); margin: var(--s6) 0; }
  .body a { color: var(--color-text-accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .body a:hover { text-decoration-thickness: 2px; }
  .body .md-table-wrap {
    overflow-x: auto; margin: var(--s5) 0; border: 1px solid var(--color-border);
    border-radius: var(--radius-lg); background: var(--color-surface-container-lowest);
  }
  .body .md-table { width: 100%; border-collapse: collapse; font-size: var(--fs-code); }
  .body .md-table th, .body .md-table td { padding: var(--s2) var(--s3); border-bottom: 1px solid var(--color-border); text-align: left; vertical-align: top; }
  .body .md-table th { background: var(--color-surface-info); color: var(--color-text-secondary); font-weight: 600; white-space: nowrap; }
  .body .md-table td { background: var(--color-surface); }
  .body .md-table tr:last-child td, .body .md-table tr:last-child th { border-bottom: 0; }
  .body .md-task { display: inline-flex; align-items: center; gap: 6px; }
  .body del { color: var(--color-text-tertiary); }
  .body strong { color: var(--color-text-primary); font-weight: 600; }
  .body > :first-child { margin-top: 0; }
  .body > :last-child { margin-bottom: 0; }

  .code-block {
    margin: var(--s4) 0; border: 1px solid var(--color-border); border-radius: var(--radius-lg);
    overflow: hidden; background: var(--color-code-bg);
  }
  .code-head {
    display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s3);
    background: var(--color-surface-container-low); border-bottom: 1px solid var(--color-border);
  }
  .code-lang { font-family: var(--font-mono); font-size: var(--fs-stamp); color: var(--color-text-tertiary); flex: 1; }
  .code-head button, .code-block .code-copy {
    font: inherit; font-size: var(--fs-stamp); cursor: pointer; min-height: 24px; padding: 2px 9px;
    border: 1px solid var(--color-border); background: var(--color-surface);
    color: var(--color-text-secondary); border-radius: var(--radius-md);
  }
  .code-head button:hover { background: var(--color-surface-hover); color: var(--color-text-primary); }
  .code-block pre { margin: 0; padding: var(--s4); overflow-x: auto; }
  .code-block code { font-family: var(--font-mono); font-size: var(--fs-code); background: none; border: 0; padding: 0; white-space: pre; line-height: 1.65; }
  /* 语法高亮跟着主题走 */
  .hl-com { color: var(--color-text-tertiary); font-style: italic; }
  .hl-str { color: var(--color-success); }
  .hl-num { color: var(--color-warning); }
  .hl-kw  { color: var(--color-brand); font-weight: 550; }
  .hl-fn  { color: var(--color-teal); }
  .hl-tag { color: var(--color-brand); }

  /* ── 输入区 ──
     cc-haha 的输入框是一张大圆角卡:白底、发丝描边、柔和投影,
     里面上面是文本域、下面一行控件,最右一个【圆形发送键】。 */
  .composer { padding: 0 var(--s7) var(--s5); background: var(--color-background); }
  .composer-inner { max-width: 800px; margin: 0 auto; }
  .editing {
    display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-note);
    color: var(--color-on-warning-container); background: var(--color-warning-container);
    border-radius: var(--radius-md); padding: var(--s2) var(--s3); margin-bottom: var(--s2);
  }
  .drop {
    border: 1px solid var(--color-border); border-radius: var(--radius-2xl);
    background: var(--color-surface); box-shadow: var(--shadow-composer);
    padding: var(--s4) var(--s4) var(--s3);
    transition: border-color 150ms var(--motion-easing), box-shadow 150ms var(--motion-easing);
  }
  .drop:focus-within { border-color: var(--cc-ac-border); }
  .drop.over { border-color: var(--color-brand); background: var(--color-brand-soft); }
  .drop textarea {
    width: 100%; border: 0; background: none; resize: none; padding: 0;
    min-height: 24px; max-height: 40vh; font-size: var(--fs-body); line-height: 1.6;
    box-shadow: none !important; border-radius: 0; color: var(--color-text-primary);
  }
  .drop textarea::placeholder { color: var(--color-text-tertiary); }
  .drop textarea:focus-visible { outline: none; }
  .pending { display: flex; gap: var(--s2); flex-wrap: wrap; padding: var(--s3) 0 0; }
  .pending .thumb { position: relative; }
  .pending img { height: 56px; border-radius: var(--radius-md); border: 1px solid var(--color-border); display: block; }
  .pending .x {
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--color-error); color: #fff; border: 0; font-size: 11px; line-height: 1;
    display: flex; align-items: center; justify-content: center; padding: 0; min-height: 0;
  }
  /* 控件行:+ / 模型 / 思考 / 深度 / 上下文 / 设备,最右是圆形发送键 */
  .send-row { display: flex; align-items: center; gap: var(--s2); padding-top: var(--s3); flex-wrap: nowrap; }
  /* 中段横向滚动:窄屏上控件多到放不下时是滑动而不是换行。
     滚动条隐掉 —— 这一行只有几个胶囊,出一条滚动条比控件本身还显眼。 */
  .row-scroll {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--s2);
    overflow-x: auto; scrollbar-width: none; padding-bottom: 1px;
  }
  .row-scroll::-webkit-scrollbar { display: none; }
  .row-scroll > * { flex: none; }
  .send-row .hint { font-size: var(--fs-stamp); color: var(--color-text-tertiary); }
  .send-row .send-btn, .send-row .plus { flex: none; }
  /* 控件在这一行里是"胶囊",不是常规输入框 */
  .send-row select {
    max-width: 230px; text-overflow: ellipsis;
    border-radius: var(--radius-full); border-color: var(--color-border);
    background-color: var(--color-surface); font-size: var(--fs-note); min-height: 32px;
    padding: 4px 24px 4px var(--s3); color: var(--color-text-secondary);
  }
  .send-row select:hover:not(:disabled) { background-color: var(--color-surface-hover); color: var(--color-text-primary); }
  .send-row label { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-stamp); color: var(--color-text-tertiary); }
  .send-row .plus {
    width: 32px; min-width: 32px; height: 32px; min-height: 32px; padding: 0; justify-content: center;
    border-radius: var(--radius-full); border-color: transparent; background: none; color: var(--color-text-secondary);
  }
  .send-row .plus:hover { background: var(--color-surface-hover); color: var(--color-text-primary); }
  /* 圆形发送键 —— 这套设计里最显眼的一个赤陶元素 */
  .send-btn {
    width: 36px; min-width: 36px; height: 36px; min-height: 36px; padding: 0; justify-content: center;
    border-radius: var(--radius-full); border: 0;
    background: var(--color-brand); color: var(--color-on-primary);
  }
  .send-btn:hover:not(:disabled) { background: var(--color-brand-hover); }
  .send-btn:disabled { background: var(--color-surface-container-high); color: var(--color-text-tertiary); opacity: 1; }
  .send-btn svg { width: 17px; height: 17px; }
  .stop-btn { background: var(--color-error); }
  .stop-btn:hover:not(:disabled) { background: var(--color-error); filter: brightness(.92); }

  /* ── 弹出菜单(+ 与 模型/深度 共用一套)──
     照 claude.ai 的形状:一列条目、可勾选、可展子菜单。定位用 absolute + bottom,
     因为它们都在页面【底部】的输入框里,往下弹会出屏。 */
  /* 弹层的定位父级。这两个必须【在 .row-scroll 之外】—— absolute 定位的弹层
     放进 overflow-x:auto 的容器里会被容器裁掉:菜单确实打开了,但一个像素都看不见
     (踩过一次,截图才发现)。 */
  .plus-wrap, .mdl-wrap { position: relative; flex: none; }
  .menu {
    position: absolute; bottom: calc(100% + 8px); left: 0; z-index: var(--z-modal);
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius-xl); box-shadow: var(--shadow-overlay);
    padding: var(--s2); min-width: 232px; max-width: min(340px, calc(100vw - var(--s6)));
    max-height: min(60vh, 460px); overflow-y: auto;
  }
  .menu.right { left: auto; right: 0; }
  .menu-item {
    width: 100%; justify-content: flex-start; gap: var(--s3); border: 0; background: none;
    font-size: var(--fs-note); padding: 7px var(--s2); min-height: 34px;
    border-radius: var(--radius-md); color: var(--color-text-secondary); text-align: left;
  }
  .menu-item:hover:not(:disabled) { background: var(--color-surface-hover); color: var(--color-text-primary); }
  .menu-item.on { color: var(--color-text-primary); }
  .menu-item .ico { flex: none; width: 16px; height: 16px; color: var(--color-text-tertiary); }
  .menu-item.on .ico { color: var(--color-brand); }
  .menu-item .lbl { flex: 1; min-width: 0; }
  .menu-item .lbl b { display: block; font-weight: 550; color: var(--color-text-primary); }
  .menu-item .lbl i { display: block; font-style: normal; font-size: var(--fs-stamp); color: var(--color-text-tertiary); margin-top: 1px; }
  .menu-item .tick { flex: none; color: var(--color-brand); font-size: 12px; }
  .menu-item .caret { flex: none; color: var(--color-text-tertiary); font-size: 10px; }
  .menu-item .val { flex: none; font-size: var(--fs-stamp); color: var(--color-text-tertiary); }
  .menu hr { border: 0; border-top: 1px solid var(--color-border); margin: var(--s1) calc(var(--s2) * -1); }
  .menu-head { font-size: var(--fs-stamp); color: var(--color-text-tertiary); padding: var(--s2) var(--s2) var(--s1); }
  .menu-note {
    font-size: var(--fs-stamp); color: var(--color-text-tertiary); line-height: 1.55;
    padding: var(--s2); border-bottom: 1px solid var(--color-border); margin-bottom: var(--s1);
  }
  /* 二级菜单:【浮在右侧】的独立面板,父菜单留在原处不动(对齐 claude.ai 的形状)。
     放不下时自动翻到左侧;窄屏上退回"同一面板换页",因为 390px 根本摆不下两列。 */
  /* 位置由 JS 相对 .plus-wrap / .mdl-wrap 算出来(见 placeSub):要量父菜单的
     实宽和触发行的位置,纯 CSS 表达不了。 */
  .submenu {
    position: absolute; z-index: var(--z-modal);
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius-xl); box-shadow: var(--shadow-overlay);
    padding: var(--s2); min-width: 216px; max-width: min(320px, calc(100vw - var(--s6)));
    max-height: min(56vh, 420px); overflow-y: auto;
  }
  /* 打开了二级菜单的那一行:高亮 + 箭头转过来,让"我在这一支下面"看得出来 */
  .menu-item.open { background: var(--color-surface-hover); color: var(--color-text-primary); }
  .menu-item.open .caret { color: var(--color-brand); }
  .menu-back { color: var(--color-text-tertiary); }
  .menu-back .ico { transform: rotate(180deg); }
  /* 窄屏:二级面板盖在父菜单【原位】上(390px 摆不下两列),父菜单顺势隐掉 */
  @media (max-width: 640px) {
    .menu.has-sub { visibility: hidden; }
  }

  /* 模型/深度触发器 */
  .mdl-btn {
    border-radius: var(--radius-full); border-color: var(--color-border);
    background: var(--color-surface); min-height: 32px; padding: 4px var(--s3);
    font-size: var(--fs-note); color: var(--color-text-secondary); max-width: 260px;
  }
  .mdl-btn:hover { background: var(--color-surface-hover); color: var(--color-text-primary); }
  .mdl-btn #mdlLabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mdl-btn .eff { flex: none; font-size: var(--fs-stamp); color: var(--color-text-tertiary); }
  .mdl-btn svg { width: 13px; height: 13px; flex: none; opacity: .7; }
  /* 只作状态位、不显示的控件 */
  .state-only { display: none !important; }

  /* 模式/技能徽标:当前开着什么,摆在输入框里 */
  .chip-row { display: inline-flex; gap: var(--s1); align-items: center; flex: none; }
  .mode-chip {
    display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-stamp);
    background: var(--color-brand-soft); color: var(--color-on-brand-soft);
    border: 1px solid var(--cc-ac-border); border-radius: var(--radius-full);
    padding: 3px 8px; white-space: nowrap;
  }
  .mode-chip button { border: 0; background: none; padding: 0 0 0 2px; min-height: 0; color: inherit; opacity: .7; font-size: 11px; }
  .mode-chip button:hover { opacity: 1; background: none; }

  /* 待发送附件:图片是缩略图,PDF/文本是一张小卡 */
  .pending .doc {
    display: inline-flex; align-items: center; gap: var(--s2); max-width: 240px;
    background: var(--color-surface-container-low); border: 1px solid var(--color-border);
    border-radius: var(--radius-md); padding: var(--s2) var(--s3); font-size: var(--fs-stamp);
    position: relative;
  }
  .pending .doc .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--color-text-primary); }
  .pending .doc .sz { color: var(--color-text-tertiary); flex: none; }
  .pending .doc svg { width: 15px; height: 15px; flex: none; color: var(--color-brand); }

  /* 消息里的附件卡 */
  .msg .atts { display: flex; gap: var(--s2); flex-wrap: wrap; margin-bottom: var(--s2); }
  .msg .att {
    display: inline-flex; align-items: center; gap: var(--s2); max-width: 260px;
    background: var(--color-surface-container-low); border: 1px solid var(--color-border);
    border-radius: var(--radius-md); padding: var(--s2) var(--s3); font-size: var(--fs-stamp);
    text-decoration: none; color: var(--color-text-primary);
  }
  .msg .att:hover { background: var(--color-surface-hover); }
  .msg .att svg { width: 15px; height: 15px; flex: none; color: var(--color-brand); }
  .msg .att .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── 联网检索的过程与来源 ── */
  .research { margin-bottom: var(--s3); }
  .research > summary {
    cursor: pointer; list-style: none; display: flex; align-items: center; gap: var(--s2);
    font-size: var(--fs-note); color: var(--color-text-tertiary);
    padding: 4px var(--s2); margin: 0 calc(var(--s2) * -1); border-radius: var(--radius-md);
  }
  .research > summary:hover { background: var(--color-surface-hover); }
  .research > summary::-webkit-details-marker { display: none; }
  .research > summary .ico { width: 14px; height: 14px; flex: none; color: var(--color-brand); }
  .research .rbody { padding: var(--s2) 0 0 var(--s5); display: flex; flex-direction: column; gap: 5px; }
  .research .q {
    font-size: var(--fs-stamp); color: var(--color-text-secondary);
    display: flex; align-items: baseline; gap: var(--s2);
  }
  .research .q::before { content: '🔍'; font-size: 10px; flex: none; }
  .research a { font-size: var(--fs-stamp); color: var(--color-text-accent); text-decoration: none; display: flex; align-items: baseline; gap: var(--s2); }
  .research a:hover { text-decoration: underline; }
  .research a .host { color: var(--color-text-tertiary); flex: none; font-size: 10px; }
  .research a .ttl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 正文末尾的来源列表:编号的胶囊,点开即原文 */
  .cites { margin-top: var(--s4); padding-top: var(--s3); border-top: 1px solid var(--color-border); }
  .cites .lbl { font-size: var(--fs-stamp); color: var(--color-text-tertiary); margin-bottom: var(--s2); }
  .cites ol { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .cites li { font-size: var(--fs-stamp); display: flex; gap: var(--s2); align-items: baseline; }
  .cites .n {
    flex: none; min-width: 17px; height: 17px; border-radius: var(--radius-full);
    background: var(--color-surface-container-high); color: var(--color-text-secondary);
    display: inline-flex; align-items: center; justify-content: center; font-size: 10px;
  }
  .cites a { color: var(--color-text-accent); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cites a:hover { text-decoration: underline; }

  /* 上下文占用:小环 + 数字,胶囊形 */
  .ctx {
    display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-stamp);
    color: var(--color-text-secondary); border: 1px solid var(--color-border);
    border-radius: var(--radius-full); padding: 4px 10px 4px 5px; cursor: help;
    background: var(--color-surface); min-height: 32px;
  }
  .ctx:hover { background: var(--color-surface-hover); color: var(--color-text-primary); }
  .ctx .ring { width: 15px; height: 15px; flex: none; }
  .ctx .ring circle { fill: none; stroke-width: 3.4; }
  /* 底圈用 outline:container-highest 和卡面几乎同色,画出来像只有一个孤点 */
  .ctx .ring .bg { stroke: var(--color-outline); }
  .ctx .ring .fg { stroke: var(--color-brand); transform: rotate(-90deg); transform-origin: center; transition: stroke-dashoffset 280ms var(--motion-easing); }
  .ctx.warn .ring .fg { stroke: var(--color-warning); }
  .ctx.warn { color: var(--color-on-warning-container); border-color: color-mix(in srgb, var(--color-warning) 32%, transparent); }
  .lock-note { font-size: var(--fs-stamp); color: var(--color-on-warning-container); }

  /* ── 右栏:Artifacts ── */
  .panel { background: var(--color-surface); border-left: 1px solid var(--color-border); display: flex; flex-direction: column; min-width: 0; }
  .panel .phead { display: flex; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--color-border); }
  .panel .ptitle { flex: 1; font-size: var(--fs-note); font-weight: 600; font-family: var(--font-headline); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .panel .ptabs { display: flex; gap: var(--s1); padding: var(--s3) var(--s4) 0; flex-wrap: wrap; }
  .panel .ptabs button { font-size: var(--fs-stamp); border-radius: var(--radius-full); padding: 3px 10px; min-height: 26px; }
  .panel .ptabs button.on { background: var(--color-brand-soft); border-color: var(--cc-ac-border); color: var(--color-on-brand-soft); }
  /* iframe 用绝对定位填满可视区:height:100% 在 flex+overflow:auto 的父级里
     会按内容高算,导致预览内容被推到面板下方 */
  .panel .pbody { flex: 1; min-height: 0; position: relative; overflow: auto; }
  .panel iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .panel .src { margin: 0; padding: var(--s4); font-family: var(--font-mono); font-size: var(--fs-code); white-space: pre; overflow: auto; line-height: 1.65; }
  .seg { display: inline-flex; border: 1px solid var(--color-border); border-radius: var(--radius-full); overflow: hidden; }
  .seg button { border: 0; border-radius: 0; min-height: 26px; font-size: var(--fs-stamp); padding: 2px 10px; }
  .seg button.on { background: var(--color-brand); color: var(--color-on-primary); }
  .art-open { margin-left: auto; }

  .lightbox { position: fixed; inset: 0; z-index: var(--z-modal); background: rgba(var(--cc-scrim-rgb), .82); display: grid; place-items: center; padding: var(--s5); }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: var(--radius-lg); }

  /* 空态 */
  .empty { padding: 12vh var(--s5) 0; text-align: center; color: var(--color-text-secondary); }
  .empty b { display: block; color: var(--color-text-primary); font-size: 26px; margin-bottom: var(--s3); font-weight: 600; font-family: var(--font-headline); letter-spacing: -.01em; }
  .empty .sub { font-size: var(--fs-note); max-width: 46ch; margin: 0 auto; line-height: 1.7; }
  .chips { display: flex; gap: var(--s2); justify-content: center; flex-wrap: wrap; margin-top: var(--s6); }
  .chips button { font-size: var(--fs-note); border-radius: var(--radius-full); padding: 7px var(--s4); color: var(--color-text-secondary); }
  .chips button:hover { color: var(--color-text-primary); border-color: var(--color-outline); }

  /* 主题选择弹层:六套色板 + 跟随系统 */
  .theme-pop {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: var(--z-modal);
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius-xl); box-shadow: var(--shadow-overlay);
    padding: var(--s2); min-width: 172px;
  }
  .theme-pop button {
    width: 100%; justify-content: flex-start; gap: var(--s3); border: 0; background: none;
    font-size: var(--fs-note); padding: 7px var(--s2); min-height: 34px; border-radius: var(--radius-md);
    color: var(--color-text-secondary);
  }
  .theme-pop button:hover { background: var(--color-surface-hover); color: var(--color-text-primary); }
  .theme-pop button.on { color: var(--color-text-primary); font-weight: 550; }
  .theme-pop button.on::after { content: '✓'; margin-left: auto; color: var(--color-brand); }
  .theme-pop .sw { width: 16px; height: 16px; border-radius: 5px; border: 1px solid var(--color-outline); flex: none; }
  .theme-pop hr { border: 0; border-top: 1px solid var(--color-border); margin: var(--s1) 0; }

  .login {
    max-width: 380px; margin: 12vh auto; background: var(--color-surface);
    border: 1px solid var(--color-border); border-radius: var(--radius-3xl);
    padding: var(--s7) var(--s6); box-shadow: var(--shadow-card);
  }
  .login h1 { font-size: 22px; margin: 0 0 var(--s1); text-align: center; font-family: var(--font-headline); font-weight: 600; }
  .login p { color: var(--color-text-secondary); margin: 0 0 var(--s5); font-size: var(--fs-note); text-align: center; }
  .login input { width: 100%; margin-bottom: var(--s3); min-height: 40px; font-size: var(--fs-body); border-radius: var(--radius-lg); }
  .login button { width: 100%; justify-content: center; min-height: 40px; border-radius: var(--radius-lg); }
  .login .alt { margin: var(--s4) 0 0; font-size: var(--fs-note); text-align: center; }
  .login .alt a { color: var(--color-text-accent); }
  .err-msg { color: var(--color-error); font-size: var(--fs-note); min-height: 18px; margin-top: var(--s2); text-align: center; }

  .toasts { position: fixed; right: var(--s5); bottom: var(--s5); z-index: var(--z-toast); display: flex; flex-direction: column; gap: var(--s2); max-width: min(380px, calc(100vw - var(--s7))); }
  .toast {
    background: var(--color-surface); color: var(--color-text-primary);
    border: 1px solid var(--color-border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-overlay); padding: var(--s3) var(--s4); font-size: var(--fs-note);
    display: flex; gap: var(--s2); animation: tin 280ms var(--motion-easing);
  }
  .toast.err { border-color: color-mix(in srgb, var(--color-error) 38%, var(--color-border)); }
  @keyframes tin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* 遮罩:桌面上永不出现(侧栏是常驻列),手机上是唯一保证"能关回去"的东西 */
  .scrim { display: none; }
  .only-sm { display: none; }
  body.no-scroll { overflow: hidden; touch-action: none; }

  @media (max-width: 900px) {
    .app, .app.with-panel { grid-template-columns: 1fr; }
    aside {
      position: fixed; inset: 0 auto 0 0; width: min(84vw, 300px); z-index: var(--z-modal);
      transform: translateX(-100%); transition: transform var(--motion-duration) var(--motion-easing);
      box-shadow: none;
      padding-left: env(safe-area-inset-left);
      padding-bottom: env(safe-area-inset-bottom);
    }
    aside.open { transform: none; box-shadow: var(--shadow-overlay); }
    .scrim { display: block; position: fixed; inset: 0; z-index: var(--z-backdrop); background: rgba(var(--cc-scrim-rgb), .45); }
    .only-sm { display: inline-flex; }
    .app.with-panel .panel { position: fixed; inset: 0; z-index: var(--z-modal); }
    .chat-head { padding: var(--s4) var(--s4) var(--s3); }
    .notice, .resumed { padding-left: var(--s4); padding-right: var(--s4); }
    .stream-inner { padding: var(--s5) var(--s4) var(--s4); }
    .composer { padding: 0 var(--s4) max(var(--s4), env(safe-area-inset-bottom)); }
    .hide-sm { display: none !important; }
    .chat-title { font-size: 17px; }
    /* 元信息在 390px 下会折成三行;模型名在输入框里已经有一份,这里省掉 */
    .chat-meta .mdl { display: none; }
    /* 触屏没有悬停,操作条一律常驻 —— 否则手机上根本点不到复制/重新生成 */
    .acts-row { opacity: 1; }
    /* 回合导航条在手机上太窄按不准,直接不出 */
    .nav-lane { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
<script>
  // 首帧就把主题定下来,避免"先白一下再变暗"。用独立的键 cc-chat-theme:
  // /admin 与 /u 仍是原来那套亮/暗二值,共用一个键会把它们弄糊涂。
  try {
    var t = localStorage.getItem('cc-chat-theme');
    var ok = ['white', 'paper', 'warm-classic', 'celadon', 'dark', 'ink-blue'];
    if (t && ok.indexOf(t) >= 0) document.documentElement.dataset.theme = t;
    else if (!t || t === 'auto') {
      document.documentElement.dataset.theme =
        window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'white';
    }
  } catch {}
</script>
</head>
<body>

<div id="loginView" class="login" hidden>
  <h1>cc-trans 聊天</h1>
  <p id="loginHint">用你的账号登录</p>
  <input id="user" type="text" placeholder="用户名" autocomplete="username" />
  <input id="pw" type="password" placeholder="密码" autocomplete="current-password" />
  <button class="primary" onclick="doLogin()">登录</button>
  <div id="loginErr" class="err-msg"></div>
  <p class="alt"><a href="/">回到统一登录入口</a></p>
</div>

<div class="app" id="app" hidden>
  <!-- 侧栏在手机上是覆盖层,遮罩必须存在:开关按钮在主区左上角、正好被侧栏盖住,
       没有遮罩就等于打开后关不掉(用户实测踩到)。 -->
  <div id="sideScrim" class="scrim" onclick="toggleSide(false)" hidden></div>
  <aside id="side">
    <div class="top" style="position:relative">
      <!-- 字标走衬线、后半截赤陶 —— cc-haha 的 "cc-haha" 就是这么排的 -->
      <span class="brand">cc-<em>trans</em></span>
      <button class="icon" onclick="toggleThemePop()" title="外观" aria-label="外观" aria-haspopup="true">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"></svg>
      </button>
      <!-- 推子而不是齿轮:紧挨着的外观按钮在亮色下是个太阳(放射状线条),
           齿轮画成小图标后轮廓几乎一样 —— 两个相邻按钮长得一样等于都认不出。 -->
      <button class="icon" onclick="prefsDlg.showModal()" title="偏好设置" aria-label="偏好设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/>
        </svg>
      </button>
      <!-- 只在手机上出现:遮罩之外再给一个明确的关闭入口 -->
      <button class="icon only-sm" onclick="toggleSide(false)" title="收起会话列表" aria-label="收起会话列表">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="theme-pop" id="themePop" hidden></div>
    </div>
    <div class="new-chat"><button onclick="newChat()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      新建会话
    </button></div>
    <div class="find">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="find" type="search" placeholder="搜索聊天" aria-label="搜索聊天" oninput="drawSessions()" />
      <kbd class="hide-sm">⌘K</kbd>
    </div>
    <div class="sessions" id="sessions"></div>
    <div class="foot">
      <div class="me"><b id="whoName"></b><span id="whoMeta"></span></div>
      <button class="usage-strip" id="usageStrip" hidden onclick="openUsage()" title="查看用量与额度">
        <span class="ut" id="usageStripLabel">用量</span>
        <span class="track" id="usageStripTrack" hidden><i id="usageStripFill" style="width:0%"></i></span>
        <span class="up" id="usageStripPct"></span>
      </button>
      <div class="acts">
        <a href="#" id="homeLink">返回</a>
        <button onclick="logout()">退出</button>
      </div>
    </div>
  </aside>

  <main>
    <!-- 会话抬头:衬线大标题 + 一行元信息。cc-haha 里每个会话最上面就是这块;
         模型/深度那些控件在这套设计里属于输入框,不属于抬头。 -->
    <div class="chat-head">
      <button class="icon ghost only-sm" onclick="toggleSide()" title="会话列表" aria-label="会话列表">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="htxt">
        <h1 class="chat-title" id="chatTitle">新的会话</h1>
        <div class="chat-meta" id="chatMeta"></div>
      </div>
      <div class="hacts">
        <button class="icon hide-sm" onclick="toggleSide()" title="收起/展开会话列表" aria-label="收起或展开会话列表">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <button class="icon" id="panelBtn" onclick="togglePanel()" hidden title="Artifacts" aria-label="Artifacts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 5h16v14H4z"/><path d="M14 5v14"/></svg>
        </button>
      </div>
    </div>

    <div class="notice" id="notice" hidden>
      <span aria-hidden="true">📣</span>
      <span class="nt" id="noticeText"></span>
      <button onclick="dismissNotice()" title="不再显示这条" aria-label="关闭公告">✕</button>
    </div>
    <div class="resumed" id="resumed" hidden></div>

    <div class="stream-wrap">
      <div class="nav-lane" id="navLane" aria-label="回合导航"></div>
      <div class="stream" id="stream">
        <div class="stream-inner" id="msgs"></div>
      </div>
      <button class="to-latest" id="toLatest" hidden onclick="scrollDown(true)">↓ 跳到最新</button>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <div class="editing" id="editingBar" hidden>
          <span>正在改写第 <b id="editIdx"></b> 条提问 —— 发送后它之后的内容会被替换</span>
          <button class="sm ghost" onclick="cancelEdit()">取消</button>
        </div>
        <div class="drop" id="drop">
          <textarea id="input" rows="1"></textarea>
          <div class="pending" id="pending"></div>
          <!-- 控件行在输入框【内部】:cc-haha 把模型、深度、上下文占用、发送键
               都收在这一行里,顶栏只留标题。 -->
          <div class="send-row">
            <div class="plus-wrap">
              <button class="plus" id="plusBtn" onclick="togglePlus()" title="添加内容" aria-label="添加内容" aria-haspopup="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              </button>
              <div class="menu" id="plusMenu" hidden><div class="menu-body" id="plusBody"></div></div>
              <!-- 二级面板是 .plus-wrap 的【兄弟】而不是 .menu 的孩子:.menu 是
                   overflow-y:auto 的滚动容器,按规范它的 overflow-x 也会变成 auto,
                   放在里面会被横向裁掉(上一版就是这么挂的,命中测试才发现)。 -->
              <div class="submenu" id="plusSub" hidden></div>
            </div>
            <!-- 一个选择器收所有类型:图片走 image block、PDF 走 document block、
                 文本/代码内联进正文(见 chat_store.js kindOf) -->
            <input type="file" id="file" multiple hidden onchange="onFiles(this.files)"
              accept="image/png,image/jpeg,image/webp,image/gif,application/pdf,text/*,.md,.json,.csv,.yaml,.yml,.toml,.js,.mjs,.ts,.tsx,.jsx,.py,.rb,.go,.rs,.java,.kt,.swift,.c,.h,.cpp,.hpp,.cs,.php,.sh,.sql,.html,.css,.xml,.vue,.svelte,.log,.diff,.patch" />
            <!-- 当前生效的模式/技能,在输入框里显式摆出来 —— 不然"我是不是开着联网"
                 只能靠记 -->
            <span class="chip-row" id="modeChips"></span>
            <!-- 控件放进可横向滚动的容器:窄屏上这一行要是换行,发送键会被挤到
                 下一行最左边 —— 又占地方又找不到。cc-haha 的 H5 同样是不换行的一行。 -->
            <div class="mdl-wrap">
              <button class="mdl-btn" id="mdlBtn" onclick="toggleModelMenu()" aria-haspopup="true">
                <span id="mdlLabel">模型</span>
                <span class="eff" id="mdlEffort"></span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="menu" id="modelMenu" hidden><div class="menu-body" id="modelBody"></div></div>
              <div class="submenu" id="modelSub" hidden></div>
            </div>
            <div class="row-scroll">
            <!-- 这三个 select 保留为【状态位】(所有既有逻辑都读 el('model').value),
                 但视觉上隐藏,由下面的嵌套菜单驱动 —— 一个触发器 → 模型列表 → 深度子菜单。 -->
            <select id="model" onchange="onModelChange()" aria-label="模型" class="state-only"></select>
            <select id="thinking" onchange="rememberSel()" aria-label="思考模式" class="state-only">
              <option value="">默认</option>
              <option value="adaptive">adaptive</option>
              <option value="disabled">关闭</option>
            </select>
            <select id="effort" onchange="rememberSel()" aria-label="深度" class="state-only">
              <option value="">默认</option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
              <option value="xhigh">xhigh</option>
              <option value="max">max</option>
            </select>
            <select id="device" onchange="onDeviceChange()" class="hide-sm" aria-label="记账到哪台设备" title="这次对话的用量记到哪台设备名下(与该设备的额度共享)"></select>
            <button class="ctx" id="ctxChip" hidden onclick="explainCtx()">
              <svg class="ring" viewBox="0 0 20 20" aria-hidden="true">
                <circle class="bg" cx="10" cy="10" r="7.5"/>
                <circle class="fg" id="ctxArc" cx="10" cy="10" r="7.5" stroke-dasharray="47.1" stroke-dashoffset="47.1"/>
              </svg>
              <span id="ctxPct">0%</span>
            </button>
            <span class="hint" id="hint"></span>
            <span class="lock-note" id="lockNote"></span>
            </div>
            <!-- 一个键两种状态:空闲发送(赤陶↑),生成中停止(红■)。
                 cc-haha 也是同一个圆键在两态之间换。 -->
            <button class="send-btn" id="sendBtn" onclick="send()" title="发送" aria-label="发送">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
            <button class="send-btn stop-btn" id="stopBtn" onclick="stopGen()" hidden title="停止" aria-label="停止">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="panel" id="panel" hidden>
    <div class="phead">
      <span class="ptitle" id="pTitle">Artifacts</span>
      <div class="seg" id="pMode">
        <button class="on" data-mode="preview" onclick="setPanelMode('preview')">预览</button>
        <button data-mode="src" onclick="setPanelMode('src')">源码</button>
      </div>
      <button class="sm" onclick="copyArtifact()">复制</button>
      <button class="sm" onclick="downloadArtifact()">下载</button>
      <button class="icon ghost" onclick="togglePanel(false)" aria-label="关闭">✕</button>
    </div>
    <div class="ptabs" id="pTabs"></div>
    <div class="pbody" id="pBody"></div>
  </div>
</div>

<div class="nav-tip" id="navTip" hidden></div>
<!-- 放大的图在打开时才建 <img>:预留一个空 src 的占位标签,在某些浏览器里
     会当成"加载失败的图"去请求当前页面 URL。 -->
<div class="lightbox" id="lightbox" hidden onclick="closeLightbox()"></div>

      <option value="mod">⌘/Ctrl+Enter 发送 · Enter 换行</option>
    </select>

    <input type="checkbox" id="prefThink" /> 默认展开思考过程
