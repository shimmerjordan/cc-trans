# cc-trans —— 从 GHCR 拉取预构建镜像部署(推荐,无需 clone、无需本地构建)
#
#   mkdir -p ~/cc-trans && cd ~/cc-trans
#   curl -fsSL -O https://raw.githubusercontent.com/shimmerjordan/cc-trans/main/docker-compose.yml
#   docker compose up -d && docker compose logs
#
# 首次启动会在 ./data/config.json 自动生成配置 + 客户端令牌 + 随机管理员密码(都打印在日志里)。
# 升级:docker compose pull && docker compose up -d
#
# 想从源码构建(改了代码 / 需要上游代理支持)?用 docker-compose.build.yml。
services:
  cc-trans:
    image: ghcr.io/shimmerjordan/cc-trans:latest
    container_name: cc-trans
    restart: unless-stopped
    # docker compose up 时自动拉最新镜像
    pull_policy: always
    ports:
      # 宿主机端口可用环境变量覆盖(端口冲突时无需改本文件),
      # 也可写进同目录 .env(见 .env.example):
      #   CC_TRANS_HOST_PORT=18787 docker compose up -d
      - "${CC_TRANS_HOST_PORT:-8787}:8787"
    volumes:
      # 全部状态(config.json / 指标 / 模型列表 / 日志块)都在这一个卷里
      - ./data:/app/data
      # 订阅 OAuth:把宿主机的 Claude 登录态挂进容器(需可读写以自动刷新 token)。
      # inherit(级联)模式也靠这行 —— 它读的是同一目录下的 settings.json,只需可读。
      # 只有用静态密钥(apiKey 模式)时才能删掉这行。
      - ${HOME}/.claude:/home/node/.claude
    environment:
      - CC_TRANS_PORT=8787
      - CC_TRANS_CONFIG=/app/data/config.json
      # 状态目录走环境变量,不写进 config.json —— 那份配置与裸机部署共用,必须可移植
      - CC_TRANS_DATA_DIR=/app/data
      - CC_TRANS_OAUTH_CREDENTIALS=/home/node/.claude/.credentials.json
      # inherit(级联)模式的来源文件。和上面一样显式写死 —— 容器里 PUID 可以是
      # 任意值,uid 不在 passwd 里时家目录推断会落到别处,路径写死最省事
      - CC_TRANS_INHERIT_SETTINGS=/home/node/.claude/settings.json
    # 日志轮转(控制磁盘占用):单文件 10MB、最多 5 个
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
